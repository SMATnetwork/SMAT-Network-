<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmatBit | News Feed</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #ffff00;
            --accent: #00ffff; --text-sec: #848e9c; --border: rgba(255, 255, 255, 0.08);
            --font-mon: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding-bottom: 100px; }
        
        .mon-900 { font-family: var(--font-mon); font-weight: 900; text-transform: uppercase; }

        /* Header */
        .news-header { 
            position: sticky; top: 0; background: rgba(11, 14, 17, 0.95);
            backdrop-filter: blur(10px); z-index: 100;
            padding: 20px; text-align: center; border-bottom: 1px solid var(--border); 
        }
        .news-header h1 { font-size: 22px; color: var(--primary); letter-spacing: 1px; }

        .news-container { padding: 15px; max-width: 600px; margin: auto; }

        /* News Card */
        .news-card {
            background: var(--card); border-radius: 20px; border: 1px solid var(--border);
            margin-bottom: 20px; overflow: hidden; animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .news-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--border); }
        .news-content { padding: 18px; }
        
        .news-tag { 
            display: inline-block; background: rgba(0, 255, 255, 0.1); color: var(--accent);
            padding: 4px 10px; border-radius: 6px; font-size: 10px; margin-bottom: 10px;
        }

        .news-title { font-size: 17px; margin-bottom: 10px; line-height: 1.4; color: #fff; }
        .news-desc { font-size: 13px; color: var(--text-sec); line-height: 1.6; font-weight: 400; }

        .news-footer { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.03);
            font-size: 11px; color: var(--text-sec);
        }

        /* Footer Nav */
        .footer { 
            position: fixed; bottom: 0; width: 100%; height: 75px; 
            background: #0b0e11; display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid var(--border); z-index: 1000;
        }
        .f-nav { text-decoration: none; color: var(--text-sec); text-align: center; font-size: 10px; flex: 1; }
        .f-nav i { font-size: 20px; display: block; margin-bottom: 5px; }
        .f-nav.active { color: var(--primary); }

        /* Shimmer Effect for Loading */
        #loading { text-align: center; padding: 50px; color: var(--accent); }
    </style>
</head>
<body>

    <div class="news-header">
        <h1 class="mon-900">News Feed</h1>
    </div>

    <div id="newsList" class="news-container">
        <div id="loading"><i class="fas fa-circle-notch fa-spin"></i> Fetching Updates...</div>
    </div>

    <footer class="footer">
        <a href="home.html" class="f-nav"><i class="fas fa-home"></i>Home</a>
        <a href="market.html" class="f-nav"><i class="fas fa-chart-line"></i>Market</a>
        <a href="news.html" class="f-nav active"><i class="fas fa-newspaper"></i>News</a>
        <a href="wallet.html" class="f-nav"><i class="fas fa-wallet"></i>Wallet</a>
    </footer>

<script>
const firebaseConfig = { apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function loadNews() {
    db.ref('news_feed').on('value', snap => {
        const list = document.getElementById('newsList');
        list.innerHTML = "";
        const data = snap.val() || {};
        const newsItems = Object.keys(data).map(k => ({id: k, ...data[k]})).sort((a,b) => b.timestamp - a.timestamp);

        if(newsItems.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:gray; margin-top:50px;">No news available.</p>`;
            return;
        }

        newsItems.forEach(news => {
            const date = new Date(news.timestamp).toLocaleDateString();
            list.innerHTML += `
                <div class="news-card">
                    ${news.image ? `<img src="${news.image}" class="news-img">` : ''}
                    <div class="news-content">
                        <span class="news-tag mon-900">${news.category || 'Announcement'}</span>
                        <h2 class="news-title mon-900">${news.title}</h2>
                        <p class="news-desc">${news.description}</p>
                        <div class="news-footer">
                            <span><i class="far fa-calendar-alt"></i> ${date}</span>
                            <span style="color:var(--primary)">SmatBit Official</span>
                        </div>
                    </div>
                </div>
            `;
        });
    });
}

loadNews();
</script>
</body>
</html>
