    <style>
        :root {
            --bg: #0b0e11;
            --card: #1e2329;
            --primary: #ffff00;
            --accent: #00ffff;
            --border: rgba(255, 255, 255, 0.08);
            --font-mon: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg); 
            color: white; 
            margin: 0;
            display: flex; 
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden; /* বডি স্ক্রল বন্ধ */
        }

        /* Fixed Header */
        .news-header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px;
            text-align: center;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 2000;
        }
        
        .news-header h1 {
            font-family: var(--font-mon);
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 1.5px;
        }

        /* Scrollable News Area */
        .scroll-area {
            margin-top: 75px; /* হেডারের জন্য জায়গা */
            margin-bottom: 70px; /* ফুটারের জন্য জায়গা */
            overflow-y: auto; 
            padding: 15px;
            height: calc(100vh - 145px); /* ডাইনামিক হাইট ক্যালকুলেশন */
            -webkit-overflow-scrolling: touch;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .news-card {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
        }

        .news-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .news-content { padding: 20px; }

        .category-tag {
            background: rgba(0, 255, 255, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: inline-block;
        }

        .news-title {
            font-family: var(--font-mon);
            font-weight: 900;
            font-size: 18px;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .news-desc {
            font-size: 14px;
            color: #b7bdc6;
            line-height: 1.5;
            margin-bottom: 15px;
            word-wrap: break-word; /* লম্বা টেক্সট যাতে ভেঙ্গে যায় */
        }

        .meta-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #848e9c;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* Fixed Footer Nav - স্ক্রিনের একদম নিচে ফিক্সড */
        .footer-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--bg);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid var(--border);
            z-index: 2000;
        }

        .nav-item { 
            text-align: center; 
            color: #848e9c; 
            text-decoration: none; 
            font-size: 10px;
            flex: 1;
        }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        #loading-ui { text-align: center; padding: 40px; color: var(--accent); font-weight: 900; font-size: 11px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <header class="news-header">
        <h1>SMAT News Feed</h1>
    </header>

    <main class="scroll-area">
        <div id="loading-ui">SYNCING DATA...</div>
        <div id="news-list" class="container"></div>
    </main>

    <footer class="footer-nav">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="market.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Market</span></a>
        <a href="news.html" class="nav-item active"><i class="fas fa-newspaper"></i><span>News</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    </footer>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
            databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadNewsData() {
            db.ref('news_feed').on('value', snap => {
                const newsList = document.getElementById('news-list');
                const loader = document.getElementById('loading-ui');
                if (loader) loader.style.display = 'none';
                newsList.innerHTML = "";
                
                const data = snap.val() || {};
                const sortedKeys = Object.keys(data).sort((a, b) => data[b].timestamp - data[a].timestamp);

                if(sortedKeys.length === 0) {
                    newsList.innerHTML = `<p style="text-align:center; color:gray; font-size:12px; margin-top:50px;">No updates available.</p>`;
                    return;
                }

                sortedKeys.forEach(key => {
                    const news = data[key];
                    const timeString = new Date(news.timestamp).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
                    
                    newsList.innerHTML += `
                        <article class="news-card">
                            <div class="img-wrapper">
                                <img src="${news.image || 'https://via.placeholder.com/600x340/1e2329/ffff00?text=SMAT+News'}" class="news-img" loading="lazy">
                            </div>
                            <div class="news-content">
                                <span class="category-tag">${news.category || 'Official'}</span>
                                <h2 class="news-title">${news.title}</h2>
                                <p class="news-desc">${news.description}</p>
                                <div class="meta-footer">
                                    <span><i class="far fa-clock"></i> ${timeString}</span>
                                    <span style="color:var(--primary)">SmatBit Official</span>
                                </div>
                            </div>
                        </article>
                    `;
                });
            });
        }
        loadNewsData();
    </script>
</body>
</html>
