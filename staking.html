<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMATBIT | Staking Hub</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #f0b90b;
            --up: #0ecb81; --down: #f6465d; --text-sec: #848e9c;
            --border: rgba(255, 255, 255, 0.08);
            --font-bold: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 900; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; padding-bottom: 100px; overflow-x: hidden; }

        /* Header Section */
        .header { padding: 40px 20px 20px; text-align: center; background: linear-gradient(180deg, rgba(240, 185, 11, 0.1) 0%, var(--bg) 100%); }
        .header h1 { font-family: var(--font-bold); color: var(--primary); font-size: 26px; text-transform: uppercase; }

        .container { padding: 0 15px; }

        /* Global & Active Info */
        .stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-card small { font-size: 10px; color: var(--text-sec); display: block; margin-bottom: 5px; }
        .stat-card b { font-size: 14px; color: var(--primary); }

        /* Staking Pool Cards */
        .stake-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .coin-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .coin-logo { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); }
        .apy-tag { margin-left: auto; background: rgba(14, 203, 129, 0.15); color: var(--up); padding: 5px 10px; border-radius: 8px; font-size: 12px; }

        /* Progress Bar for Pool Limit */
        .pool-progress { height: 6px; background: #181a20; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.5s; }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-opt { background: #181a20; border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: white; cursor: pointer; font-size: 12px; text-align: center; }
        
        /* Modal Popup */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal { background: #1e2329; width: 100%; max-width: 400px; border-radius: 24px; padding: 25px; border: 1px solid var(--border); }
        
        .input-box { background: #0b0e11; border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid var(--border); position: relative; }
        .input-box input { width: 100%; background: transparent; border: none; color: white; font-size: 20px; outline: none; padding-right: 50px; }
        .max-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); font-size: 12px; cursor: pointer; }

        .duration-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .dur-tab { background: #0b0e11; border: 1px solid var(--border); padding: 8px; border-radius: 8px; text-align: center; font-size: 11px; cursor: pointer; }
        .dur-tab.active { border-color: var(--primary); color: var(--primary); }

        .calc-info { margin-top: 15px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; font-size: 11px; color: var(--text-sec); }
        .calc-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .btn-confirm { width: 100%; background: var(--primary); color: black; border: none; padding: 16px; border-radius: 16px; margin-top: 20px; cursor: pointer; font-size: 14px; }

        /* My Stakes List */
        .my-stakes-list { margin-top: 30px; }
        .active-stake-item { background: #181a20; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid var(--up); }

        .footer {position: fixed; bottom: 0; width: 100%; height: 75px; background: #0b0e11; display: flex; justify-content: space-around; align-items: center; z-index: 4000; border-top: 1px solid var(--border); }
        .f-nav {text-decoration: none; color: var(--text-sec); text-align: center; font-size: 12px; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .f-nav.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Staking Hub</h1>
        <p style="font-size: 11px; color: var(--text-sec); margin-top: 5px;">Earn Passive Income with SMATBIT</p>
    </div>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-card">
                <small>Global Staked</small>
                <b id="globalTotal">0.00000000</b>
            </div>
            <div class="stat-card">
                <small>My Total Yield</small>
                <b id="myTotalYield">0.00000000</b>
            </div>
        </div>

        <div id="stakingPools">
            </div>

        <div class="my-stakes-list" id="myActiveStakes">
            <h3 style="margin-bottom: 15px; font-size: 16px; font-family: var(--font-bold);">Active Stakes</h3>
            <div id="activeList"></div>
        </div>
    </div>

    <div class="overlay" id="stakeOverlay">
        <div class="modal" id="modalBody"></div>
    </div>

    <footer class="footer">
        <a href="home.html" class="f-nav"><i class="fas fa-home"></i>Home</a>
        <a href="wallet.html" class="f-nav"><i class="fas fa-wallet"></i>Wallet</a>
        <a href="staking.html" class="f-nav active"><i class="fas fa-layer-group"></i>Stake</a>
        <a href="mining.html" class="f-nav"><i class="fas fa-microchip"></i>Mining</a>
    </footer>

<script>
// --- FIREBASE INITIALIZATION ---
const firebaseConfig = { apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", authDomain: "smat-exchange.firebaseapp.com", projectId: "smat-exchange", databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" };
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userData = {}, stakingSettings = {}, liveGlobalStaked = 0;

// --- 8 DECIMAL FORMATTER ---
function f8(num) {
    if(!num) return "0.00000000";
    return parseFloat(num).toFixed(8);
}

function init() {
    auth.onAuthStateChanged(user => {
        if (user) {
            db.ref('staking_settings').on('value', snap => {
                stakingSettings = snap.val() || {};
                renderPools();
            });
            db.ref('users/' + user.uid).on('value', snap => {
                userData = snap.val() || {};
                renderMyStakes();
            });
        } else { location.href = "logIn.html"; }
    });
}

function renderPools() {
    const cont = document.getElementById('stakingPools');
    let html = "";
    liveGlobalStaked = 0;

    Object.keys(stakingSettings).forEach(key => {
        const c = stakingSettings[key];
        const staked = c.totalStaked || 0;
        const max = c.maxPool || 1000000;
        const progress = (staked / max) * 100;
        liveGlobalStaked += staked;

        // Dynamic APY (Pool বাড়লে APY কমে)
        const currentAPY = (c.startingAPY * (1 - (staked / max))).toFixed(2);

        html += `
            <div class="stake-card">
                <div class="coin-header">
                    <img src="${c.logopath}" class="coin-logo" onerror="this.src='assets/logos/generic.png'">
                    <div>
                        <p style="font-size:14px;">${c.name}</p>
                        <small style="color:var(--text-sec)">${c.network}</small>
                    </div>
                    <div class="apy-tag">${currentAPY}% APY</div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-sec)">
                    <span>Pool Filled</span>
                    <span>${f8(staked)} / ${f8(max)}</span>
                </div>
                <div class="pool-progress"><div class="progress-fill" style="width:${progress}%"></div></div>
                <div class="action-btns">
                    <div class="btn-opt" onclick="openModal('${key}', 'flexible')">FLEXIBLE</div>
                    <div class="btn-opt" onclick="openModal('${key}', 'fixed')" style="border-color:var(--primary); color:var(--primary)">FIXED</div>
                </div>
            </div>
        `;
    });
    cont.innerHTML = html;
    document.getElementById('globalTotal').innerText = f8(liveGlobalStaked);
}

function openModal(key, type) {
    const c = stakingSettings[key];
    const s = c.symbol.toLowerCase();
    const bal = userData[s + '_balance'] || 0;
    
    document.getElementById('modalBody').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="font-family:var(--font-bold)">STAKE ${c.symbol}</h3>
            <i class="fas fa-times" onclick="closeModal()" style="color:var(--text-sec)"></i>
        </div>
        <p style="font-size:11px; color:var(--text-sec); margin-top:10px;">Balance: ${f8(bal)} ${c.symbol}</p>
        
        <div class="input-box">
            <input type="number" id="stkAmt" placeholder="0.00" oninput="updateCalc('${key}', '${type}')">
            <span class="max-btn" onclick="setMax('${bal}', '${key}', '${type}')">MAX</span>
        </div>

        ${type === 'fixed' ? `
            <div class="duration-grid" id="durGrid">
                <div class="dur-tab active" data-d="15" data-m="1.1">15D</div>
                <div class="dur-tab" data-d="30" data-m="1.2">30D</div>
                <div class="dur-tab" data-d="90" data-m="1.5">90D</div>
                <div class="dur-tab" data-d="180" data-m="2.0">180D</div>
            </div>
        ` : `<p style="font-size:11px; color:var(--up); margin-top:15px;"><i class="fas fa-check-circle"></i> Flexible: Unstake any time</p>`}

        <div class="calc-info">
            <div class="calc-row"><span>Estimated APY</span><b id="estApy" style="color:var(--up)">0.00%</b></div>
            <div class="calc-row"><span>Daily Earnings</span><b id="dailyEarn" style="color:white">0.00000000</b></div>
        </div>

        <button class="btn-confirm" id="confirmBtn" onclick="executeStake('${key}', '${type}')">STAKE NOW</button>
    `;
    
    document.getElementById('stakeOverlay').style.display = 'flex';
    if(type === 'fixed') {
        document.querySelectorAll('.dur-tab').forEach(t => t.onclick = () => {
            document.querySelectorAll('.dur-tab').forEach(r => r.classList.remove('active'));
            t.classList.add('active');
            updateCalc(key, type);
        });
    }
    updateCalc(key, type);
}

function updateCalc(key, type) {
    const c = stakingSettings[key];
    const amt = parseFloat(document.getElementById('stkAmt').value) || 0;
    let apy = c.startingAPY * (1 - ((c.totalStaked || 0) / (c.maxPool || 1000000)));
    
    if(type === 'fixed') {
        const multiplier = parseFloat(document.querySelector('.dur-tab.active').dataset.m);
        apy = apy * multiplier; // Fixed এ মেয়াদ বাড়লে APY বাড়বে
    }

    const daily = (amt * (apy / 100)) / 365;
    document.getElementById('estApy').innerText = apy.toFixed(2) + "%";
    document.getElementById('dailyEarn').innerText = f8(daily);
}

function setMax(bal, key, type) {
    document.getElementById('stkAmt').value = bal;
    updateCalc(key, type);
}

async function executeStake(key, type) {
    const c = stakingSettings[key];
    const amt = parseFloat(document.getElementById('stkAmt').value);
    const s = c.symbol.toLowerCase();
    const bal = userData[s + '_balance'] || 0;
    const btn = document.getElementById('confirmBtn');

    if(!amt || amt <= 0 || amt > bal) return alert("Invalid amount!");

    btn.disabled = true;
    btn.innerText = "PROCESSING...";

    const txId = db.ref(`users/${auth.currentUser.uid}/stakes`).push().key;
    const sSym = 's' + s; // s শব্দ যুক্ত করা (যেমন sbnb)
    const apy = parseFloat(document.getElementById('estApy').innerText);
    const ts = Date.now();

    const updates = {};
    // ১. মেইন ব্যালেন্স থেকে কাটা
    updates[`users/${auth.currentUser.uid}/${s}_balance`] = parseFloat((bal - amt).toFixed(8));
    // ২. স্ট্যাকিং এসেটে যোগ করা
    updates[`users/${auth.currentUser.uid}/${sSym}_balance`] = parseFloat(((userData[sSym + '_balance'] || 0) + amt).toFixed(8));
    // ৩. স্টেক ডাটা সেভ
    updates[`users/${auth.currentUser.uid}/stakes/${txId}`] = {
        coin: c.symbol, amount: amt, type: type, apy: apy, startTime: ts, status: 'active',
        duration: type === 'fixed' ? parseInt(document.querySelector('.dur-tab.active').dataset.d) : 0
    };
    // ৪. গ্লোবাল পুল আপডেট
    updates[`staking_settings/${key}/totalStaked`] = (c.totalStaked || 0) + amt;
    // ৫. ওয়ালেট হিস্ট্রি (OUTGOING)
    updates[`users/${auth.currentUser.uid}/history/${txId}`] = {
        method: 'Stake Out', coin: c.symbol, amount: f8(amt), status: 'success', 
        timestamp: ts, address: 'Staking Pool', hash: 'STK-'+txId.substring(1,8).toUpperCase()
    };

    await db.ref().update(updates);
    alert("Staking Successful!");
    closeModal();
}

function renderMyStakes() {
    const cont = document.getElementById('activeList');
    const myStakes = userData.stakes;
    let html = "";
    let totalYield = 0;

    if(!myStakes) {
        cont.innerHTML = "<p style='text-align:center; color:var(--text-sec); font-size:12px;'>No active stakes found.</p>";
        return;
    }

    Object.keys(myStakes).forEach(id => {
        const stk = myStakes[id];
        if(stk.status === 'active') {
            html += `
                <div class="active-stake-item">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b>${f8(stk.amount)} ${stk.coin}</b>
                        <span style="color:var(--up); font-size:12px;">+${stk.apy}% APY</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                        <small style="color:var(--text-sec)">Type: ${stk.type.toUpperCase()} (${stk.duration}D)</small>
                        <button onclick="unstake('${id}')" style="background:var(--down); color:white; border:none; padding:4px 10px; border-radius:5px; font-size:10px;">UNSTAKE</button>
                    </div>
                </div>
            `;
        }
    });
    cont.innerHTML = html;
}

async function unstake(id) {
    if(!confirm("Are you sure you want to unstake?")) return;
    
    const stk = userData.stakes[id];
    const s = stk.coin.toLowerCase();
    const sSym = 's' + s;
    const ts = Date.now();

    const updates = {};
    updates[`users/${auth.currentUser.uid}/${s}_balance`] = parseFloat(((userData[s + '_balance'] || 0) + stk.amount).toFixed(8));
    updates[`users/${auth.currentUser.uid}/${sSym}_balance`] = parseFloat(((userData[sSym + '_balance'] || 0) - stk.amount).toFixed(8));
    updates[`users/${auth.currentUser.uid}/stakes/${id}/status`] = 'closed';
    // গ্লোবাল পুল থেকে কমানো
    const poolKey = Object.keys(stakingSettings).find(k => stakingSettings[k].symbol === stk.coin);
    updates[`staking_settings/${poolKey}/totalStaked`] = Math.max(0, (stakingSettings[poolKey].totalStaked || 0) - stk.amount);
    // ওয়ালেট হিস্ট্রি (INCOMING)
    updates[`users/${auth.currentUser.uid}/history/${id}_un`] = {
        method: 'Unstake In', coin: stk.coin, amount: f8(stk.amount), status: 'success', 
        timestamp: ts, address: 'From Pool', hash: 'USTK-'+id.substring(1,8).toUpperCase()
    };

    await db.ref().update(updates);
    alert("Unstaked successfully!");
}

function closeModal() { document.getElementById('stakeOverlay').style.display = 'none'; }
window.onload = init;
</script>
</body>
</html>
