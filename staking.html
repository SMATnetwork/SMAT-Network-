<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmatBit | Professional Staking</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #f0b90b;
            --up: #0ecb81; --down: #f6465d; --text-sec: #848e9c;
            --border: rgba(255, 255, 255, 0.08);
            --font-mont: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 700; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; padding-bottom: 100px; display: none; }

        /* UI Elements */
        .header { padding: 30px 20px; text-align: center; background: linear-gradient(180deg, rgba(240, 185, 11, 0.1) 0%, var(--bg) 100%); }
        .header h1 { font-family: var(--font-mont); color: var(--primary); font-size: 24px; text-transform: uppercase; }
        
        .container { padding: 0 15px; }

        /* Multi-Token Cards */
        .stake-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .coin-info { display: flex; align-items: center; gap: 12px; }
        .coin-logo { width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--border); }
        .apy-tag { margin-left: auto; color: var(--up); font-size: 16px; text-align: right; }
        
        .progress-container { margin: 15px 0; }
        .progress-bar { height: 6px; background: #000; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); transition: 0.8s; }
        .pool-text { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-sec); margin-top: 5px; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-opt { padding: 12px; border-radius: 12px; background: #2b3139; color: white; text-align: center; font-size: 12px; cursor: pointer; border: 1px solid var(--border); }
        .btn-opt.highlight { border-color: var(--primary); color: var(--primary); }

        /* Custom Graphic Toast */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; width: 90%; max-width: 350px; }
        .toast { background: #1e2329; border: 1px solid var(--border); border-left: 5px solid var(--primary); padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; animation: slideDown 0.4s ease forwards; }
        .toast.success { border-left-color: var(--up); }
        .toast.error { border-left-color: var(--down); }
        .toast-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); }

        /* Modal */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal { background: var(--card); width: 100%; max-width: 400px; border-radius: 24px; padding: 25px; border: 1px solid var(--border); }
        
        .input-group { background: #0b0e11; border-radius: 15px; padding: 15px; margin: 15px 0; border: 1px solid var(--border); position: relative; }
        .input-group input { width: 75%; background: transparent; border: none; color: white; font-size: 20px; outline: none; }
        .max-btn { position: absolute; right: 15px; color: var(--primary); font-size: 12px; cursor: pointer; top: 50%; transform: translateY(-50%); }

        .dur-flex { display: flex; gap: 8px; margin-bottom: 20px; }
        .dur-btn { flex: 1; padding: 10px; background: #0b0e11; border-radius: 10px; border: 1px solid var(--border); color: var(--text-sec); text-align: center; font-size: 11px; cursor: pointer; }
        .dur-btn.active { border-color: var(--primary); color: var(--primary); }

        .btn-main { width: 100%; padding: 16px; background: var(--primary); color: #000; border: none; border-radius: 16px; font-weight: 900; cursor: pointer; }
        
        /* My Active Stakes */
        .active-list { margin-top: 30px; }
        .my-stake-card { background: #181a20; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid var(--up); }

        /* Nav */
        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: var(--bg); display: flex; border-top: 1px solid var(--border); z-index: 4000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--text-sec); font-size: 11px; gap: 5px; }
        .nav-item.active { color: var(--primary); }

        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Staking Hub</h1>
        <p style="font-size: 10px; color: var(--text-sec);">Passive Earnings • Multi-Token Support</p>
    </div>

    <div class="container">
        <div id="poolContainer"></div>

        <div class="active-list">
            <h3 style="margin-bottom: 15px; font-family: var(--font-mont);">My Stakes</h3>
            <div id="myStakesArea"></div>
        </div>
    </div>

    <div class="overlay" id="stakeOverlay">
        <div class="modal" id="modalBox"></div>
    </div>

    <footer class="footer">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i>Wallet</a>
        <a href="staking.html" class="nav-item active"><i class="fas fa-layer-group"></i>Stake</a>
        <a href="mining.html" class="nav-item"><i class="fas fa-microchip"></i>Mining</a>
    </footer>

<script>
// --- FIREBASE INITIALIZE ---
const firebaseConfig = { 
    apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
    authDomain: "smat-exchange.firebaseapp.com", 
    projectId: "smat-exchange", 
    databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userData = {}, pools = {};

// 8 Decimal Helper
const f8 = (n) => parseFloat(n || 0).toFixed(8);

// 1. Auth Guard & Data Sync
auth.onAuthStateChanged(user => {
    if (user) {
        document.body.style.display = "block";
        syncData(user.uid);
    } else {
        window.location.href = "logIn.html";
    }
});

function syncData(uid) {
    db.ref('staking_settings').on('value', snap => {
        pools = snap.val() || {};
        renderPools();
    });
    db.ref('users/' + uid).on('value', snap => {
        userData = snap.val() || {};
        renderMyStakes();
    });
}

// 2. Multi-Token Pool Rendering
function renderPools() {
    const area = document.getElementById('poolContainer');
    let html = "";

    Object.keys(pools).forEach(key => {
        const p = pools[key];
        const staked = p.totalStaked || 0;
        const max = p.maxPool || 1000000;
        const progress = Math.min((staked/max)*100, 100);
        const apy = (p.startingAPY * (1 - (staked/max))).toFixed(2);

        html += `
            <div class="stake-card">
                <div class="coin-info">
                    <img src="${p.logopath}" class="coin-logo" onerror="this.src='assets/logos/generic.png'">
                    <div><b>${p.name}</b><br><small style="color:var(--text-sec)">${p.network}</small></div>
                    <div class="apy-tag"><b>${apy}%</b><br><span style="font-size:9px">APY</span></div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <div class="pool-text"><span>Filled: ${progress.toFixed(1)}%</span><span>Total: ${f8(staked)}</span></div>
                </div>
                <div class="btn-grid">
                    <div class="btn-opt" onclick="openStake('${key}', 'flexible')">Flexible</div>
                    <div class="btn-opt highlight" onclick="openStake('${key}', 'fixed')">Fixed Stake</div>
                </div>
            </div>`;
    });
    area.innerHTML = html || "<p style='text-align:center'>No pools online.</p>";
}

// 3. Smart Stake Modal
function openStake(key, type) {
    const p = pools[key];
    const bal = userData[p.symbol.toLowerCase() + '_balance'] || 0;

    document.getElementById('modalBox').innerHTML = `
        <div style="display:flex; justify-content:space-between"><h3>Stake ${p.symbol}</h3><i class="fas fa-times" onclick="closeModal()"></i></div>
        <p style="font-size:11px; color:var(--text-sec); margin-top:10px;">Wallet: ${f8(bal)} ${p.symbol}</p>
        
        <div class="input-group">
            <input type="number" id="amt" placeholder="0.00" oninput="calcPreview('${key}', '${type}')">
            <span class="max-btn" onclick="document.getElementById('amt').value='${bal}'; calcPreview('${key}', '${type}')">MAX</span>
        </div>

        ${type === 'fixed' ? `
            <div class="dur-flex">
                <div class="dur-btn active" data-d="15" data-m="1.2">15D</div>
                <div class="dur-btn" data-d="30" data-m="1.5">30D</div>
                <div class="dur-btn" data-d="90" data-m="2.0">90D</div>
            </div>
        ` : ''}

        <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; font-size:12px;">
            <div style="display:flex; justify-content:space-between"><span>APY Rate</span><b id="pApy" style="color:var(--up)">0.00%</b></div>
            <div style="display:flex; justify-content:space-between; margin-top:5px;"><span>Daily Earning</span><b id="pDaily">0.00000000</b></div>
        </div>

        <button class="btn-main" id="confBtn" style="margin-top:20px" onclick="confirmStake('${key}', '${type}')">CONFIRM</button>
    `;

    document.getElementById('stakeOverlay').style.display = 'flex';
    if(type==='fixed') {
        document.querySelectorAll('.dur-btn').forEach(b => b.onclick = () => {
            document.querySelectorAll('.dur-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            calcPreview(key, type);
        });
    }
    calcPreview(key, type);
}

function calcPreview(key, type) {
    const p = pools[key];
    const val = parseFloat(document.getElementById('amt').value) || 0;
    let apy = p.startingAPY * (1 - ((p.totalStaked||0)/ (p.maxPool||1000000)));
    if(type==='fixed') apy *= parseFloat(document.querySelector('.dur-btn.active').dataset.m);
    
    document.getElementById('pApy').innerText = apy.toFixed(2) + "%";
    document.getElementById('pDaily').innerText = f8((val * (apy/100)) / 365);
}

// 4. Execution & Graphic Toast
async function confirmStake(key, type) {
    const p = pools[key];
    const amt = parseFloat(document.getElementById('amt').value);
    const sym = p.symbol.toLowerCase();
    const bal = userData[sym + '_balance'] || 0;

    if(!amt || amt <= 0 || amt > bal) return toast("Invalid amount!", "error");

    const btn = document.getElementById('confBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    const tid = "STK" + Date.now();
    const up = {};
    up[`users/${auth.currentUser.uid}/${sym}_balance`] = parseFloat((bal - amt).toFixed(8));
    up[`users/${auth.currentUser.uid}/s${sym}_balance`] = parseFloat(((userData['s'+sym+'_balance']||0) + amt).toFixed(8));
    up[`users/${auth.currentUser.uid}/stakes/${tid}`] = {
        coin: p.symbol, amount: amt, type: type, apy: parseFloat(document.getElementById('pApy').innerText),
        startTime: Date.now(), status: 'active', duration: type==='fixed' ? parseInt(document.querySelector('.dur-btn.active').dataset.d) : 0
    };
    up[`staking_settings/${key}/totalStaked`] = (p.totalStaked||0) + amt;
    up[`users/${auth.currentUser.uid}/history/${tid}`] = {
        method: 'Stake Out', coin: p.symbol, amount: f8(amt), status: 'success', timestamp: Date.now(), hash: 'TX'+tid
    };

    await db.ref().update(up);
    toast(`${p.symbol} Staked Successfully!`, "success");
    closeModal();
}

function renderMyStakes() {
    const area = document.getElementById('myStakesArea');
    const s = userData.stakes;
    let html = "";
    if(!s) return area.innerHTML = "<p style='font-size:11px; color:var(--text-sec); text-align:center'>No active assets.</p>";

    Object.keys(s).forEach(id => {
        const item = s[id];
        if(item.status === 'active') {
            html += `<div class="my-stake-card">
                <div style="display:flex; justify-content:space-between"><b>${f8(item.amount)} ${item.coin}</b><span style="color:var(--up)">+${item.apy}%</span></div>
                <div style="display:flex; justify-content:space-between; margin-top:10px"><small>${item.type.toUpperCase()}</small>
                <button onclick="processUnstake('${id}')" style="background:var(--down); border:none; padding:4px 10px; border-radius:5px; color:white; font-size:10px;">UNSTAKE</button></div>
            </div>`;
        }
    });
    area.innerHTML = html;
}

async function processUnstake(id) {
    if(!confirm("Return asset to wallet?")) return;
    const item = userData.stakes[id];
    const sym = item.coin.toLowerCase();
    const up = {};
    up[`users/${auth.currentUser.uid}/${sym}_balance`] = parseFloat(((userData[sym+'_balance']||0) + item.amount).toFixed(8));
    up[`users/${auth.currentUser.uid}/s${sym}_balance`] = parseFloat(((userData['s'+sym+'_balance']||0) - item.amount).toFixed(8));
    up[`users/${auth.currentUser.uid}/stakes/${id}/status`] = 'closed';
    
    const pKey = Object.keys(pools).find(k => pools[k].symbol === item.coin);
    up[`staking_settings/${pKey}/totalStaked`] = Math.max(0, (pools[pKey].totalStaked||0) - item.amount);
    up[`users/${auth.currentUser.uid}/history/${id}_un`] = {
        method: 'Unstake In', coin: item.coin, amount: f8(item.amount), status: 'success', timestamp: Date.now(), hash: 'UX'+id
    };

    await db.ref().update(up);
    toast("Unstaked successfully!", "success");
}

// Toast Function
function toast(msg, type) {
    const c = document.getElementById('toastContainer') || (() => {
        const d = document.createElement('div'); d.id = 'toastContainer'; d.className = 'toast-container';
        document.body.appendChild(d); return d;
    })();
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<div class="toast-icon"><i class="fas ${type==='success'?'fa-check':'fa-times'}"></i></div>
                   <div><b style="font-size:12px">${type==='success'?'Success':'Failed'}</b><br><span style="font-size:10px">${msg}</span></div>`;
    c.appendChild(t);
    setTimeout(() => t.style.animation = 'fadeOut 0.4s forwards', 3000);
    setTimeout(() => t.remove(), 3500);
}

function closeModal() { document.getElementById('stakeOverlay').style.display = 'none'; }
</script>
</body>
</html>
