<html lang="en">
<head>

    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #f3ba2f; /* Yellow */
            --cyan: #00ffff; --text-sec: #848e9c; --border: rgba(255, 255, 255, 0.08);
            --up: #0ecb81; --font-bold: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 900; }
        body { background: var(--bg); color: white; padding-bottom: 100px; }

        .header { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, rgba(243, 186, 47, 0.1) 0%, var(--bg) 100%); }
        .token-val { font-family: var(--font-bold); font-size: 32px; color: var(--primary); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .label { font-size: 10px; color: var(--text-sec); margin-bottom: 5px; text-transform: uppercase; }

        .presale-card { background: var(--card); margin: 0 15px; border-radius: 20px; padding: 20px; border: 1px solid var(--border); }
        
        /* Asset Switcher Bar */
        .asset-switcher { display: flex; background: var(--bg); border-radius: 12px; padding: 5px; margin-bottom: 15px; border: 1px solid var(--border); }
        .switch-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; background: transparent; color: var(--text-sec); cursor: pointer; font-size: 12px; transition: 0.3s; }
        .switch-btn.active { background: var(--card); color: white; border: 1px solid var(--border); }
        .switch-btn.active.bnb { color: var(--primary); }
        .switch-btn.active.eth { color: #627eea; }

        .input-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; align-items: center; }
        .input-box input { background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 20px; }
        
        .valuation-bar { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px dashed var(--border); }
        
        .btn-main { width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 16px; cursor: pointer; transition: 0.2s; background: var(--primary); color: black; }
        .btn-main:active { transform: scale(0.97); }

        .btn-claim { width: 100%; padding: 18px; border-radius: 15px; margin-top: 15px; border: 2px dashed var(--border); background: transparent; color: var(--text-sec); cursor: not-allowed; }
        .btn-claim.active { background: var(--up); color: white; border: none; cursor: pointer; box-shadow: 0 5px 20px rgba(14,203,129,0.3); }

        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0b0e11; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); }
        .f-nav { text-decoration: none; color: var(--text-sec); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .f-nav.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <p style="font-size: 11px; color: var(--cyan); letter-spacing: 2px;">SmatBit PRESALE PHASE</p>
        <div class="token-val">750,000 SMAT</div>
        <p style="font-size: 10px; color: var(--text-sec);">1 SMAT = <span id="smatRateDisplay">$0.00</span> USDT</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">Total Pool Value</div>
            <div style="font-size: 18px;">$<span id="totalPoolUSD">0.00</span></div>
        </div>
        <div class="stat-card">
            <div class="label">My Commit USD</div>
            <div style="font-size: 18px; color: var(--cyan);">$<span id="myTotalUSD">0.00</span></div>
        </div>
    </div>

    <div class="presale-card">
        <div class="asset-switcher">
            <button class="switch-btn active bnb" id="bnbSwitch" onclick="toggleAsset('bnb')">BNB</button>
            <button class="switch-btn eth" id="ethSwitch" onclick="toggleAsset('eth')">ETH</button>
        </div>

        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:8px;">
            <span style="color:var(--text-sec)">Commit Amount</span>
            <span id="currentBalance" style="color:var(--primary)">Bal: 0.00</span>
        </div>

        <div class="input-box">
            <input type="number" id="commitInput" placeholder="0.00" oninput="calcValuation()">
            <span id="selectedAssetTag" style="color:var(--primary); font-size:14px;">BNB</span>
        </div>

        <div class="valuation-bar">
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
                <span style="color:var(--text-sec)">Input Valuation:</span>
                <span style="color:white">$<span id="inputUsdVal">0.00</span> USDT</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:12px;">
                <span style="color:var(--text-sec)">Expected SMAT:</span>
                <span style="color:var(--up)"><span id="expectedSmat">0.00</span> SMAT</span>
            </div>
        </div>

        <button class="btn-main" id="commitBtn" onclick="processCommitment()">CONFIRM COMMITMENT</button>

        <div style="margin-top:20px; padding-top:15px; border-top:1px solid var(--border); display:flex; justify-content:space-between; font-size:11px;">
            <span>Committed BNB: <b id="dispBnb">0.00</b></span>
            <span>Committed ETH: <b id="dispEth">0.00</b></span>
        </div>

        <button id="claimBtn" class="btn-claim" disabled onclick="processClaim()">
            <i class="fas fa-lock"></i> CLAIM SMAT TO WALLET
        </button>
    </div>

    <footer class="footer">
        <a href="home.html" class="f-nav"><i class="fas fa-home"></i>Home</a>
        <a href="presale.html" class="f-nav active"><i class="fas fa-gem"></i>Presale</a>
        <a href="wallet.html" class="f-nav"><i class="fas fa-wallet"></i>Wallet</a>
    </footer>

    <script>
        // --- DATA & CONFIG ---
        const firebaseConfig = { 
            apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
            authDomain: "smat-exchange.firebaseapp.com", 
            projectId: "smat-exchange", 
            databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com", 
            storageBucket: "smat-exchange.appspot.com", 
            messagingSenderId: "836334569396", 
            appId: "1:836334569396:web:679effe640b3453412d4e1" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let userData = {}, poolData = { totalUsd: 0, claimEnabled: false };
        let livePrices = { bnb: 0, eth: 0 };
        let currentAsset = 'bnb';
        const TOTAL_SMAT = 750000;

        // --- BINANCE SOCKET ---
        const streams = ['bnbusdt@ticker', 'ethusdt@ticker'];
        const socket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams.join('/')}`);
        socket.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.stream === 'bnbusdt@ticker') livePrices.bnb = parseFloat(msg.data.c);
            if(msg.stream === 'ethusdt@ticker') livePrices.eth = parseFloat(msg.data.c);
            updateUI();
        };

        // --- INITIALIZE ---
        function init() {
            auth.onAuthStateChanged(user => {
                if(user) {
                    db.ref('presale_global').on('value', s => { poolData = s.val() || {totalUsd:0, claimEnabled:false}; updateUI(); });
                    db.ref('users/' + user.uid).on('value', s => { userData = s.val() || {}; updateUI(); });
                } else { window.location.href = "logIn.html"; }
            });
        }

        function toggleAsset(asset) {
            currentAsset = asset;
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(asset + 'Switch').classList.add('active');
            
            const tag = document.getElementById('selectedAssetTag');
            tag.innerText = asset.toUpperCase();
            tag.style.color = (asset === 'bnb') ? 'var(--primary)' : '#627eea';
            
            updateUI();
        }

        function updateUI() {
            const bal = userData[currentAsset + '_balance'] || 0;
            document.getElementById('currentBalance').innerText = `Bal: ${parseFloat(bal).toFixed(4)}`;
            
            const myBnb = parseFloat(userData.presale_bnb || 0);
            const myEth = parseFloat(userData.presale_eth || 0);
            const myUsd = (myBnb * livePrices.bnb) + (myEth * livePrices.eth);

            const rate = poolData.totalUsd > 0 ? (poolData.totalUsd / TOTAL_SMAT) : 0.0001;
            const myAlloc = rate > 0 ? (myUsd / rate) : 0;

            document.getElementById('totalPoolUSD').innerText = poolData.totalUsd.toLocaleString(undefined, {minimumFractionDigits:2});
            document.getElementById('smatRateDisplay').innerText = rate.toFixed(6);
            document.getElementById('myTotalUSD').innerText = myUsd.toFixed(2);
            document.getElementById('dispBnb').innerText = myBnb.toFixed(4);
            document.getElementById('dispEth').innerText = myEth.toFixed(4);

            // Claim Status
            const cBtn = document.getElementById('claimBtn');
            if(poolData.claimEnabled && myAlloc > 0) {
                cBtn.disabled = false; cBtn.classList.add('active');
                cBtn.innerHTML = '<i class="fas fa-unlock"></i> CLAIM SMAT NOW';
            }
            calcValuation();
        }

        function calcValuation() {
            const amt = parseFloat(document.getElementById('commitInput').value) || 0;
            const usd = amt * livePrices[currentAsset];
            document.getElementById('inputUsdVal').innerText = usd.toFixed(2);
            
            const rate = poolData.totalUsd > 0 ? (poolData.totalUsd / TOTAL_SMAT) : 0.0001;
            const expected = rate > 0 ? (usd / rate) : 0;
            document.getElementById('expectedSmat').innerText = expected.toFixed(2);
        }

        async function processCommitment() {
            const amt = parseFloat(document.getElementById('commitInput').value);
            const userBal = parseFloat(userData[currentAsset + '_balance'] || 0);

            if(!amt || amt <= 0) return alert("Enter amount");
            if(amt > userBal) return alert("Insufficient Balance");

            const usdVal = amt * livePrices[currentAsset];
            const uid = auth.currentUser.uid;
            const updates = {};

            updates[`users/${uid}/${currentAsset}_balance`] = userBal - amt;
            updates[`users/${uid}/presale_${currentAsset}`] = (parseFloat(userData['presale_'+currentAsset] || 0)) + amt;
            updates[`presale_global/totalUsd`] = (poolData.totalUsd || 0) + usdVal;

            try {
                await db.ref().update(updates);
                document.getElementById('commitInput').value = "";
                alert("Commitment Successful!");
            } catch(e) { alert(e.message); }
        }

        async function processClaim() {
            const myBnb = parseFloat(userData.presale_bnb || 0);
            const myEth = parseFloat(userData.presale_eth || 0);
            const myUsd = (myBnb * livePrices.bnb) + (myEth * livePrices.eth);
            const rate = poolData.totalUsd / TOTAL_SMAT;
            const alloc = myUsd / rate;

            const updates = {};
            const uid = auth.currentUser.uid;
            updates[`users/${uid}/smat_balance`] = (parseFloat(userData.smat_balance || 0)) + alloc;
            updates[`users/${uid}/presale_bnb`] = 0;
            updates[`users/${uid}/presale_eth`] = 0;

            try {
                await db.ref().update(updates);
                alert(`Claimed ${alloc.toFixed(2)} SMAT!`);
            } catch(e) { alert(e.message); }
        }

        window.onload = init;
    </script>
</body>
</html>
