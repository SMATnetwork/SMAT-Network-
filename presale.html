<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMAT | Presale</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #f3ba2f; 
            --cyan: #00ffff; --text-sec: #848e9c; --border: rgba(255, 255, 255, 0.08);
            --up: #0ecb81; --err: #f6465d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 700; }
        body { background: var(--bg); color: white; padding-bottom: 100px; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 350px; }
        .toast { background: var(--card); border-left: 4px solid var(--primary); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; animation: slideIn 0.3s ease-out; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .toast.success { border-left-color: var(--up); }
        .toast.error { border-left-color: var(--err); }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .header { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, rgba(243, 186, 47, 0.1) 0%, var(--bg) 100%); }
        .token-val { font-family: 'Montserrat', sans-serif; font-size: 32px; color: var(--primary); }
        /* সলিড ব্লিংকিং ডট */
.status-dot {
    height: 8px;
    width: 8px;
    background-color: #0ecb81; /* সলিড গ্রিন */
    border-radius: 50%;
    display: inline-block;
    margin-left: 5px; /* লেখা থেকে ডটের দূরত্ব */
    vertical-align: middle; /* লেখার সাথে এলাইনমেন্ট ঠিক রাখার জন্য */
    animation: blinker 1s linear infinite;
}

@keyframes blinker {
    50% { opacity: 0; }
}

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .label { font-size: 10px; color: var(--text-sec); margin-bottom: 5px; text-transform: uppercase; }

        .presale-card { background: var(--card); margin: 0 15px; border-radius: 20px; padding: 20px; border: 1px solid var(--border); }
        .asset-switcher { display: flex; background: var(--bg); border-radius: 12px; padding: 5px; margin-bottom: 15px; border: 1px solid var(--border); }
        .switch-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; background: transparent; color: var(--text-sec); cursor: pointer; font-size: 12px; transition: 0.3s; }
        .switch-btn.active { background: var(--card); color: white; border: 1px solid var(--border); }
        .switch-btn.active.bnb { color: var(--primary); }
        .switch-btn.active.eth { color: #627eea; }

        .input-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; align-items: center; }
        .input-box input { background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 20px; font-weight: bold; }
        
        .user-report { margin-top: 15px; padding: 15px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid var(--border); }
        .report-line { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: var(--text-sec); }
        .report-line b { color: white; font-family: monospace; }

        .btn-main { width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 16px; cursor: pointer; background: var(--primary); color: black; text-transform: uppercase; margin-top: 10px; transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); opacity: 0.9; }
        .btn-claim { width: 100%; padding: 18px; border-radius: 15px; margin-top: 15px; border: 2px dashed var(--border); background: transparent; color: var(--text-sec); cursor: not-allowed; }
        .btn-claim.active { background: var(--up); color: white; border: none; cursor: pointer; }

        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0b0e11; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); }
        .f-nav { text-decoration: none; color: var(--text-sec); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .f-nav.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="header">
    <p style="font-size: 11px; color: var(--cyan); letter-spacing: 2px; display: flex; align-items: center; justify-content: center;">
        SMAT PRESALE Live <span class="status-dot"></span>
    </p>
    <div class="token-val">750,000 SMAT</div>
    <p style="font-size: 10px; color: var(--text-sec);">
        Live SMAT Rate: <span id="smatRateDisplay">$0.00000000</span>
    </p>
</div>


    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">Pool Total USD</div>
            <div style="font-size: 16px;">$<span id="totalPoolUSD">0.00</span></div>
        </div>
        <div class="stat-card">
            <div class="label">My Total Shares</div>
            <div style="font-size: 16px; color: var(--cyan);">$<span id="myTotalUSD">0.00</span></div>
        </div>
    </div>

    <div class="presale-card">
        <div class="asset-switcher">
            <button class="switch-btn active bnb" id="bnbSwitch" onclick="toggleAsset('bnb')">BNB</button>
            <button class="switch-btn eth" id="ethSwitch" onclick="toggleAsset('eth')">ETH</button>
        </div>

        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:8px;">
            <span style="color:var(--text-sec)">Available Balance</span>
            <span id="currentBalance" style="color:var(--primary)">0.00000000</span>
        </div>

        <div class="input-box">
            <input type="number" id="commitInput" placeholder="0.00" oninput="calcValuation()">
            <span id="selectedAssetTag" style="color:var(--primary); font-size:14px;">BNB</span>
        </div>

        <div class="user-report">
            <div class="report-line"><span>Total Accumulated BNB:</span> <b id="dispBnb">0.00000000</b></div>
            <div class="report-line"><span>Total Accumulated ETH:</span> <b id="dispEth">0.00000000</b></div>
            <div class="report-line" style="border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px;">
                <span style="color:var(--cyan)">Est. SMAT Reward:</span> 
                <b id="mySmatAlloc" style="color:var(--up)">0.00000000 SMAT</b>
            </div>
        </div>

        <button class="btn-main" onclick="processCommitment()">CONFIRM COMMIT</button>

        <button id="claimBtn" class="btn-claim" disabled onclick="processClaim()">
            <i class="fas fa-lock"></i> CLAIM TO WALLET
        </button>
    </div>

    <footer class="footer">
        <a href="home.html" class="f-nav"><i class="fas fa-home"></i>Home</a>
        <a href="presale.html" class="f-nav active"><i class="fas fa-gem"></i>Presale</a>
        <a href="wallet.html" class="f-nav"><i class="fas fa-wallet"></i>Wallet</a>
    </footer>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
            authDomain: "smat-exchange.firebaseapp.com", 
            projectId: "smat-exchange", 
            databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com", 
            storageBucket: "smat-exchange.appspot.com", 
            messagingSenderId: "836334569396", 
            appId: "1:836334569396:web:679effe640b3453412d4e1" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let userData = {}, poolData = { totalUsd: 0, claimEnabled: false };
        let livePrices = { bnb: 0, eth: 0 };
        let currentAsset = 'bnb';
        const TOTAL_SMAT_SUPPLY = 750000;

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
        }

        const streams = ['bnbusdt@ticker', 'ethusdt@ticker'];
        const socket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams.join('/')}`);
        socket.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.stream === 'bnbusdt@ticker') livePrices.bnb = parseFloat(msg.data.c);
            if(msg.stream === 'ethusdt@ticker') livePrices.eth = parseFloat(msg.data.c);
            updateUI();
        };

        function init() {
            auth.onAuthStateChanged(user => {
                if(user) {
                    db.ref('presale_global').on('value', s => { poolData = s.val() || {totalUsd:0, claimEnabled:false}; updateUI(); });
                    db.ref('users/' + user.uid).on('value', s => { userData = s.val() || {}; updateUI(); });
                } else { window.location.href = "logIn.html"; }
            });
        }

        function toggleAsset(asset) {
            currentAsset = asset;
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(asset + 'Switch').classList.add('active');
            document.getElementById('selectedAssetTag').innerText = asset.toUpperCase();
            document.getElementById('selectedAssetTag').style.color = (asset === 'bnb') ? 'var(--primary)' : '#627eea';
            updateUI();
        }

        function updateUI() {
            const bal = parseFloat(userData[currentAsset + '_balance'] || 0);
            document.getElementById('currentBalance').innerText = bal.toFixed(8);
            
            const totalPoolUsd = parseFloat(poolData.totalUsd || 0);
            const accBnb = parseFloat(userData.presale_bnb || 0);
            const accEth = parseFloat(userData.presale_eth || 0);
            const myLiveUsdVal = (accBnb * livePrices.bnb) + (accEth * livePrices.eth);

            let smatRate = totalPoolUsd > 0 ? (totalPoolUsd / TOTAL_SMAT_SUPPLY) : 0;

            document.getElementById('totalPoolUSD').innerText = totalPoolUsd.toLocaleString(undefined, {minimumFractionDigits:2});
            document.getElementById('smatRateDisplay').innerText = "$" + smatRate.toFixed(8);
            document.getElementById('myTotalUSD').innerText = myLiveUsdVal.toFixed(2);
            document.getElementById('dispBnb').innerText = accBnb.toFixed(8);
            document.getElementById('dispEth').innerText = accEth.toFixed(8);

            calcValuation(); // টাইপ না করলেও এক্যুমুলেটেড ভ্যালু অনুযায়ী টোকেন দেখাবে

            const cBtn = document.getElementById('claimBtn');
            const myAlloc = smatRate > 0 ? (myLiveUsdVal / smatRate) : 0;
            if(poolData.claimEnabled && myAlloc > 0) {
                cBtn.disabled = false; cBtn.classList.add('active');
                cBtn.innerHTML = `<i class="fas fa-unlock"></i> CLAIM TO WALLET`;
            } else {
                cBtn.disabled = true; cBtn.classList.remove('active');
                cBtn.innerHTML = `<i class="fas fa-lock"></i> CLAIM TO WALLET`;
            }
        }

        function calcValuation() {
            const amt = parseFloat(document.getElementById('commitInput').value) || 0;
            const inputUsdVal = amt * (livePrices[currentAsset] || 0);
            
            const totalPoolUsd = parseFloat(poolData.totalUsd || 0);
            const accBnb = parseFloat(userData.presale_bnb || 0);
            const accEth = parseFloat(userData.presale_eth || 0);
            const myExistingUsd = (accBnb * livePrices.bnb) + (accEth * livePrices.eth);

            // গাণিতিক লজিক: (ইউজারের মোট সম্ভাব্য ডলার / পুলের মোট সম্ভাব্য ডলার) * মোট সাপ্লাই
            const hypotheticalTotalUsd = totalPoolUsd + inputUsdVal;
            const myTotalHypotheticalUsd = myExistingUsd + inputUsdVal;

            let expectedSmat = 0;
            if (hypotheticalTotalUsd > 0) {
                expectedSmat = (myTotalHypotheticalUsd / hypotheticalTotalUsd) * TOTAL_SMAT_SUPPLY;
            }

            document.getElementById('mySmatAlloc').innerText = expectedSmat.toFixed(8) + " SMAT";
        }

        async function processCommitment() {
            const amt = parseFloat(document.getElementById('commitInput').value);
            const userBal = parseFloat(userData[currentAsset + '_balance'] || 0);
            
            if(!amt || amt <= 0) return showToast("Enter a valid amount", "error");
            if(amt > userBal) return showToast("Insufficient Balance", "error");
            if(livePrices[currentAsset] <= 0) return showToast("Waiting for live price...", "error");

            const usdValAdded = amt * livePrices[currentAsset];
            const uid = auth.currentUser.uid;
            
            const updates = {};
            updates[`users/${uid}/${currentAsset}_balance`] = userBal - amt;
            updates[`users/${uid}/presale_${currentAsset}`] = (parseFloat(userData['presale_'+currentAsset] || 0)) + amt;
            updates[`presale_global/totalUsd`] = (parseFloat(poolData.totalUsd || 0)) + usdValAdded;

            try {
                await db.ref().update(updates);
                document.getElementById('commitInput').value = "";
                showToast("Commitment added to your total share!");
            } catch(e) { showToast(e.message, "error"); }
        }

        async function processClaim() {
            const accBnb = parseFloat(userData.presale_bnb || 0);
            const accEth = parseFloat(userData.presale_eth || 0);
            const totalPoolUsd = parseFloat(poolData.totalUsd || 0);
            
            if(totalPoolUsd <= 0) return;

            const myLiveUsd = (accBnb * livePrices.bnb) + (accEth * livePrices.eth);
            const smatRate = totalPoolUsd / TOTAL_SMAT_SUPPLY;
            const finalAlloc = myLiveUsd / smatRate;

            const uid = auth.currentUser.uid;
            const updates = {};
            updates[`users/${uid}/smat_balance`] = (parseFloat(userData.smat_balance || 0)) + finalAlloc;
            updates[`users/${uid}/presale_bnb`] = 0;
            updates[`users/${uid}/presale_eth`] = 0;

            try {
                await db.ref().update(updates);
                showToast(`Successfully claimed ${finalAlloc.toFixed(4)} SMAT!`);
            } catch(e) { showToast(e.message, "error"); }
        }

        window.onload = init;
    </script>
</body>
</html>
