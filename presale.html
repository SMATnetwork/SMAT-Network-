    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #f3ba2f; /* BNB Yellow */
            --cyan: #00ffff; --text-sec: #848e9c; --border: rgba(255, 255, 255, 0.08);
            --up: #0ecb81; --font-bold: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 900; }
        body { background: var(--bg); color: white; padding-bottom: 100px; }

        .header { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, rgba(243, 186, 47, 0.1) 0%, var(--bg) 100%); }
        .token-val { font-family: var(--font-bold); font-size: 30px; color: var(--primary); }
        .cyan-text { color: var(--cyan); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .label { font-size: 10px; color: var(--text-sec); margin-bottom: 5px; }

        .presale-card { background: var(--card); margin: 0 15px; border-radius: 20px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .input-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; align-items: center; margin-top: 10px; }
        .input-box input { background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 18px; }
        
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 15px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-bnb { background: var(--primary); color: black; }
        .btn-eth { background: #627eea; color: white; }
        .btn-claim { background: transparent; border: 2px dashed var(--border); color: var(--text-sec); margin-top: 20px; cursor: not-allowed; }
        .btn-claim.active { background: var(--up); color: white; border: none; cursor: pointer; box-shadow: 0 5px 15px rgba(14,203,129,0.3); }

        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0b0e11; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000; }
        .f-nav { text-decoration: none; color: var(--text-sec); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .f-nav.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <p style="font-size: 12px; color: var(--text-sec);">SmatBit <span class="cyan-text">OFFICIAL PRESALE</span></p>
        <div class="token-val">750,000 SMAT</div>
        <p style="font-size: 10px; color: var(--text-sec);">OVERFLOW COMMITMENT METHOD</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">POOL VALUE (USDT)</div>
            <div style="font-size: 16px;">$<span id="totalPoolUSD">0.00</span></div>
        </div>
        <div class="stat-card">
            <div class="label">SMAT RATE (EST.)</div>
            <div style="font-size: 16px;">$<span id="smatRate">0.00</span></div>
        </div>
    </div>

    <div class="presale-card">
        <div style="display:flex; justify-content:space-between; font-size:11px;">
            <span style="color:var(--text-sec)">Commit Assets</span>
            <span id="assetBalance">Bal: 0.00</span>
        </div>
        <div class="input-box">
            <input type="number" id="commitInput" placeholder="0.00" oninput="calcValuation()">
            <span id="activeAssetLabel" style="color:var(--primary)">BNB</span>
        </div>
        <p style="text-align:right; font-size:10px; color:var(--text-sec); margin-top:5px;">
            ≈ $<span id="inputUSD">0.00</span> USDT
        </p>

        <div style="background:rgba(255,255,255,0.03); padding:12px; border-radius:10px; margin:15px 0; font-size:11px; text-align:center;">
            My Valuation: <span id="myTotalUSD" class="cyan-text">$0.00</span> | 
            Allocation: <span id="mySmatAlloc" style="color:var(--up)">0.00 SMAT</span>
        </div>

        <button class="btn btn-bnb" onclick="setAsset('bnb')">COMMIT BNB</button>
        <button class="btn btn-eth" onclick="setAsset('eth')">COMMIT ETH</button>

        <button id="claimBtn" class="btn btn-claim" disabled onclick="claimTokens()">
            <i class="fas fa-lock"></i> CLAIM SMAT
        </button>

        <div style="margin-top:20px; display:flex; justify-content:space-between; font-size:11px; color:var(--text-sec);">
            <span>My BNB: <b id="myBnb" style="color:white">0</b></span>
            <span>My ETH: <b id="myEth" style="color:white">0</b></span>
        </div>
    </div>

    <footer class="footer">
        <a href="home.html" class="f-nav"><i class="fas fa-home"></i>Home</a>
        <a href="presale.html" class="f-nav active"><i class="fas fa-gem"></i>Presale</a>
        <a href="wallet.html" class="f-nav"><i class="fas fa-wallet"></i>Wallet</a>
    </footer>

    <script>
        // --- CONFIG & FIREBASE ---
        const firebaseConfig = { 
            apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
            authDomain: "smat-exchange.firebaseapp.com", 
            projectId: "smat-exchange", 
            databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com", 
            storageBucket: "smat-exchange.appspot.com", 
            messagingSenderId: "836334569396", 
            appId: "1:836334569396:web:679effe640b3453412d4e1" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let userData = {};
        let livePrices = { bnb: 0, eth: 0 };
        let poolData = { totalUsd: 0, claimEnabled: false };
        const TOTAL_SMAT = 750000;

        // --- BINANCE LIVE WEB SOCKET ---
        const streams = ['bnbusdt@ticker', 'ethusdt@ticker'];
        const socket = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams.join('/')}`);

        socket.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if(msg.stream === 'bnbusdt@ticker') livePrices.bnb = parseFloat(msg.data.c);
            if(msg.stream === 'ethusdt@ticker') livePrices.eth = parseFloat(msg.data.c);
            updateUI();
        };

        // --- CORE LOGIC ---
        function init() {
            auth.onAuthStateChanged(user => {
                if(user) {
                    db.ref('presale_global').on('value', s => { poolData = s.val() || {totalUsd:0, claimEnabled:false}; updateUI(); });
                    db.ref('users/' + user.uid).on('value', s => { userData = s.val() || {}; updateUI(); });
                } else { window.location.href = "logIn.html"; }
            });
        }

        function updateUI() {
            const myBnb = parseFloat(userData.presale_bnb || 0);
            const myEth = parseFloat(userData.presale_eth || 0);
            const myUsd = (myBnb * livePrices.bnb) + (myEth * livePrices.eth);
            
            // SMAT Rate = Total Pool / Total Supply
            const rate = poolData.totalUsd > 0 ? (poolData.totalUsd / TOTAL_SMAT) : 0.0001;
            const myAlloc = rate > 0 ? (myUsd / rate) : 0;

            document.getElementById('totalPoolUSD').innerText = poolData.totalUsd.toLocaleString(undefined,{minimumFractionDigits:2});
            document.getElementById('smatRate').innerText = rate.toFixed(6);
            document.getElementById('myTotalUSD').innerText = "$" + myUsd.toFixed(2);
            document.getElementById('mySmatAlloc').innerText = myAlloc.toFixed(2) + " SMAT";
            document.getElementById('myBnb').innerText = myBnb.toFixed(4);
            document.getElementById('myEth').innerText = myEth.toFixed(4);

            // Button Control
            const btn = document.getElementById('claimBtn');
            if(poolData.claimEnabled && myAlloc > 0) {
                btn.disabled = false; btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-unlock"></i> CLAIM NOW';
            }
            calcValuation();
        }

        function setAsset(a) {
            document.getElementById('activeAssetLabel').innerText = a.toUpperCase();
            document.getElementById('activeAssetLabel').style.color = (a === 'bnb') ? 'var(--primary)' : '#627eea';
            const bal = userData[a + '_balance'] || 0;
            document.getElementById('assetBalance').innerText = "Bal: " + parseFloat(bal).toFixed(4);
            handleCommit(a);
        }

        function calcValuation() {
            const amt = parseFloat(document.getElementById('commitInput').value) || 0;
            const asset = document.getElementById('activeAssetLabel').innerText.toLowerCase();
            const val = amt * livePrices[asset];
            document.getElementById('inputUSD').innerText = val.toFixed(2);
        }

        async function handleCommit(asset) {
            const amt = parseFloat(document.getElementById('commitInput').value);
            const userBal = parseFloat(userData[asset + '_balance'] || 0);

            if(!amt || amt <= 0 || isNaN(amt)) return; // শুধু ভ্যালু থাকলে প্রসেস হবে
            if(amt > userBal) { alert("Insufficient Balance"); return; }

            const usdVal = amt * livePrices[asset];
            const uid = auth.currentUser.uid;
            const updates = {};

            updates[`users/${uid}/${asset}_balance`] = userBal - amt;
            updates[`users/${uid}/presale_${asset}`] = (parseFloat(userData['presale_'+asset] || 0)) + amt;
            updates[`presale_global/totalUsd`] = (poolData.totalUsd || 0) + usdVal;

            try {
                await db.ref().update(updates);
                document.getElementById('commitInput').value = "";
                alert("Commitment Added!");
            } catch(e) { alert("Error: " + e.message); }
        }

        async function claimTokens() {
            const myBnb = parseFloat(userData.presale_bnb || 0);
            const myEth = parseFloat(userData.presale_eth || 0);
            const myUsd = (myBnb * livePrices.bnb) + (myEth * livePrices.eth);
            const rate = poolData.totalUsd / TOTAL_SMAT;
            const alloc = myUsd / rate;

            if(alloc <= 0) return;

            const updates = {};
            const uid = auth.currentUser.uid;
            updates[`users/${uid}/smat_balance`] = (parseFloat(userData.smat_balance || 0)) + alloc;
            updates[`users/${uid}/presale_bnb`] = 0;
            updates[`users/${uid}/presale_eth`] = 0;

            try {
                await db.ref().update(updates);
                alert("Claimed " + alloc.toFixed(2) + " SMAT successfully!");
            } catch(e) { alert(e.message); }
        }

        window.onload = init;
    </script>
</body>
</html>
