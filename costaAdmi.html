<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costa Group | Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00FFFF;
            --yellow: #FFFF00;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --border: #334155;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--cyan);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        header h1 {
            font-weight: 900;
            color: var(--yellow);
            text-transform: uppercase;
            margin: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--cyan);
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #334155;
            color: var(--cyan);
            text-transform: uppercase;
            font-size: 12px;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .pending { background: #ca8a04; color: #fff; }
        .approved { background: #16a34a; color: #fff; }

        .btn-view {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 8px 15px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Modal / Edit Section */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            overflow-y: auto;
            z-index: 100;
        }

        .modal-content {
            background: #fff;
            color: #000;
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 8px;
        }

        .sig-upload-box {
            border: 2px dashed #ccc;
            padding: 20px;
            margin-top: 20px;
            background: #f9fafb;
        }

        .sig-preview-admin {
            width: 300px;
            height: 80px;
            border: 1px solid #000;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-save { background: #000; color: #fff; padding: 15px 30px; border: none; font-weight: 900; cursor: pointer; flex: 1; }
        .btn-close { background: #ccc; padding: 15px 30px; border: none; cursor: pointer; }

    </style>
</head>
<body>

<div class="admin-container">
    <header>
        <h1>Costa Group Admin Panel</h1>
        <div id="adminInfo">Admin: Active</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><h3 id="totalApps">0</h3><p>Total Applications</p></div>
        <div class="stat-card"><h3 id="pendingApps">0</h3><p>Pending Review</p></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Candidate Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="appTableBody">
            <!-- Data will load here from Firebase -->
        </tbody>
    </table>
</div>

<!-- Edit Application Modal -->
<div id="editModal" class="admin-modal">
    <div class="modal-content">
        <h2 style="border-bottom: 2px solid #000; padding-bottom: 10px;">REVIEW APPLICATION</h2>
        <div id="userDataDisplay"></div>

        <div class="sig-upload-box">
            <h3>Admin & Authority Verification</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <!-- Admin Signature -->
                <div>
                    <label>Admin Signature (80x300)</label>
                    <input type="file" onchange="previewSig(event, 'adminSigView')">
                    <div class="sig-preview-admin">
                        <img id="adminSigView" style="width:100%; height:100%; object-fit:contain; display:none;">
                    </div>
                </div>
                <!-- Authority Signature -->
                <div>
                    <label>Authority Signature (80x300)</label>
                    <input type="file" onchange="previewSig(event, 'authSigView')">
                    <div class="sig-preview-admin">
                        <img id="authSigView" style="width:100%; height:100%; object-fit:contain; display:none;">
                    </div>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-close" onclick="closeAdminModal()">CANCEL</button>
            <button class="btn-save" onclick="saveAdminAction()">UPDATE & SEND TO USER</button>
        </div>
    </div>
</div>

<!-- Firebase SDKs (Compat Mode) -->
<script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>

<script>

    let currentEditingDocId = null;
    let adminSigBase64 = "";
    let authSigBase64 = "";

    // সিগনেচার প্রিভিউ ফাংশন
    function previewSig(e, targetId) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            if(targetId === 'adminSigView') adminSigBase64 = reader.result;
            if(targetId === 'authSigView') authSigBase64 = reader.result;
            document.getElementById(targetId).src = reader.result;
            document.getElementById(targetId).style.display = 'block';
        }
        reader.readAsDataURL(file);
    }

    }

    function openReview(docId) {
        currentEditingDocId = docId;
        document.getElementById('editModal').style.display = 'block';
        // এখানে ফায়ারবেস থেকে নির্দিষ্ট docId এর ডাটা নিয়ে এসে 'userDataDisplay' তে দেখাবে
    }

    function closeAdminModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    // এডমিন যখন সিগনেচার সহ আপডেট করবে
    async function saveAdminAction() {
        if(!adminSigBase64 || !authSigBase64) {

        }

</script>

</body>
</html>
