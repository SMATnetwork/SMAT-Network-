<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costa Group | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .admin-container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { color: #008c95; border-bottom: 2px solid #008c95; padding-bottom: 10px; }
        
        .upload-section { display: flex; gap: 20px; margin-bottom: 30px; background: #e9ecef; padding: 20px; border-radius: 8px; }
        .sig-box { flex: 1; text-align: center; border: 2px dashed #008c95; padding: 10px; background: #fff; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #dee2e6; text-align: left; }
        th { background: #008c95; color: white; }
        
        .status-badge { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .pending { background: #ffe066; }
        .approved { background: #8ce99a; }

        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-send { background: #000; color: #fff; }
        .btn-view { background: #008c95; color: #fff; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>Admin Control Panel - SmatBit Ecosystem</h1>

    <!-- Signature Management -->
    <div class="upload-section">
        <div class="sig-box">
            <label><b>Admin Official Signature</b></label><br><br>
            <input type="file" id="adminSigInput" onchange="uploadAdminSig('admin')">
            <div id="adminPrev"></div>
        </div>
        <div class="sig-box">
            <label><b>Authority Official Signature</b></label><br><br>
            <input type="file" id="authSigInput" onchange="uploadAdminSig('auth')">
            <div id="authPrev"></div>
        </div>
    </div>

    <!-- User Applications List -->
    <h2>Pending Applications</h2>
    <table>
        <thead>
            <tr>
                <th>User Name</th>
                <th>Application ID</th>
                <th>Apply Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="userTable">
            <!-- Data will come from Firebase/Database -->
            <tr>
                <td>Sadekul Islam</td>
                <td>#CB-10023</td>
                <td>10-May-2026</td>
                <td><span class="status-badge pending">Pending</span></td>
                <td>
                    <button class="btn btn-view" onclick="viewApplication('10023')">Review</button>
                    <button class="btn btn-send" onclick="sendToUser('10023')">Approve & Send PDF</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // এই ফাংশনটি এডমিনের সিগনেচার ডাটাবেসে সেভ করবে
    function uploadAdminSig(type) {
        alert(type + " Signature Uploaded Successfully! This will now be attached to all approved PDFs.");
    }

    // ইউজারকে ফরমটি পুনরায় পাঠানোর লজিক
    function sendToUser(appId) {
        alert("Application #" + appId + " has been signed and sent to the user's dashboard.");
        // এখানে Firebase logic হবে যা ইউজারের 'isApproved' স্ট্যাটাস true করে দিবে।
    }
</script>

</body>
</html>
