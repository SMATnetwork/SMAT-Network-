<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Getway</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --yellow: #FFFF00; --cyan: #00FFFF; --bg: #050505; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg); color: white; padding: 15px; }

        /* Graphic Toast */
        #graphic-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #111, #222);
            border: 2px solid var(--cyan); border-radius: 50px;
            padding: 12px 25px; display: flex; align-items: center; gap: 10px;
            z-index: 10000; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px var(--cyan);
        }
        #graphic-toast.active { top: 30px; }

        /* Grid Layout (3 on top, 2 on bottom) */
        .gateway-title { text-align: center; color: var(--yellow); font-weight: 800; margin: 25px 0; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 255, 0, 0.5); }
        
        .pay-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; max-width: 500px; margin: 0 auto; }
        .method-card { grid-column: span 2; background: #0f0f0f; border: 1px solid #222; padding: 20px 10px; border-radius: 20px; cursor: pointer; text-align: center; transition: 0.3s; }
        .method-card:hover { border-color: var(--cyan); transform: scale(1.05); box-shadow: 0 0 15px var(--cyan); }
        .method-card:nth-child(4) { grid-column: 2 / span 2; }
        .method-card:nth-child(5) { grid-column: 4 / span 2; }
        
        .logo-box { width: 45px; height: 45px; background: rgba(255,255,255,0.05); border-radius: 12px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
        .method-card p { font-size: 13px; font-weight: 800; }

        /* Popups */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9000; backdrop-filter: blur(15px); align-items: center; justify-content: center; }
        .popup-content { width: 92%; max-width: 400px; background: #0a0a0a; border: 2px solid var(--cyan); border-radius: 30px; padding: 30px; position: relative; animation: zoomIn 0.3s ease; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .close-pop { position: absolute; top: 15px; right: 20px; font-size: 28px; color: var(--yellow); cursor: pointer; }

        .copy-area { background: rgba(255, 255, 0, 0.05); padding: 18px; border-radius: 15px; border: 1px dashed var(--yellow); display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        input, select { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; outline: none; font-weight: 600; }
        .sub-btn { width: 100%; padding: 16px; background: linear-gradient(90deg, var(--cyan), #008888); border: none; border-radius: 12px; color: #000; font-weight: 800; cursor: pointer; margin-top: 15px; }

        /* History */
        .history-box { max-width: 500px; margin: 40px auto; }
        .h-item { background: #0f0f0f; padding: 15px; border-radius: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1a1a1a; }
        .spin { width: 20px; height: 20px; border: 3px solid #333; border-top-color: var(--cyan); border-radius: 50%; animation: rot 1s infinite linear; }
        @keyframes rot { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="graphic-toast">
        <div style="width:25px; height:25px; background:var(--cyan); border-radius:50%; color:#000; display:flex; align-items:center; justify-content:center; font-weight:900;">✓</div>
        <span id="toast-msg">Success</span>
    </div>

    <h2 class="gateway-title">Costa Payment</h2>

    <div class="pay-grid">
        <div class="method-card" onclick="openFiat('bKash', '0192888')"><div class="logo-box"></div><p style="color:#E2136E">bKash</p></div>
        <div class="method-card" onclick="openFiat('Nagad', '0171111')"><div class="logo-box"></div><p style="color:#F7941D">Nagad</p></div>
        <div class="method-card" onclick="openFiat('Rocket', '0181111')"><div class="logo-box"></div><p style="color:#8C3494">Rocket</p></div>
        <div class="method-card" onclick="openFiat('Upay', '0161111')"><div class="logo-box"></div><p style="color:#007BFF">Upay</p></div>
        <div class="method-card" onclick="openCrypto()"><div class="logo-box"></div><p style="color:var(--cyan)">Crypto</p></div>
    </div>

    <div id="fiatPop" class="overlay">
        <div class="popup-content">
            <span class="close-pop" onclick="closeAll()">&times;</span>
            <h3 id="fiatTitle" style="color:var(--cyan); text-align:center;">Payment</h3>
            <div class="copy-area">
                <span id="targetNum" style="font-weight:800;">0192888</span>
                <button onclick="copyIt('targetNum')" style="background:var(--yellow); border:none; padding:8px 12px; border-radius:8px; font-weight:800; cursor:pointer">COPY</button>
            </div>
            <input type="number" id="fA" placeholder="Ammount (BDT)">
            <input type="text" id="fT" placeholder="Trx ID">
            <button class="sub-btn" onclick="submitData('fiat')">SUBMIT</button>
        </div>
    </div>

    <div id="cryptoPop" class="overlay">
        <div class="popup-content">
            <span class="close-pop" onclick="closeAll()">&times;</span>
            <h3 style="color:var(--cyan); text-align:center;">Cryptocurrency</h3>
            
            <select id="netSelect">
                <option value="">Select Network</option>
                <option value="BSC">Binance Smart Chain</option>
                <option value="ETH">Ethereum</option>
                <option value="Polygon">Polygon</option>
                <option value="Solana">Solana</option>
            </select>

            <select id="coinSelect" onchange="initSocket()">
                <option value="">Select Coin</option>
                <option value="bnbusdt">BNB</option>
                <option value="ethusdt">ETH</option>
                <option value="usdt">USDT</option>
                <option value="solusdt">SOL</option>
                <option value="polusdt">POL</option>
            </select>

            <div id="priceInfo" style="font-size:13px; color:var(--yellow); margin:10px 0; font-weight:700;">Live Price: $0.00</div>

            <input type="number" id="cA" placeholder="Ammount" oninput="calcCrypto()">
            <p id="convertText" style="font-size:12px; color:var(--cyan); margin-bottom:10px; font-weight:600;"></p>

            <div class="copy-area">
                <span id="walletAddr" style="font-size:10px;">0x71C7656EC7ab88b098defB751B7401B5f6d8976F</span>
                <button onclick="copyIt('walletAddr')" style="background:var(--yellow); border:none; padding:8px 12px; border-radius:8px; font-weight:800; cursor:pointer">COPY</button>
            </div>

            <input type="text" id="cH" placeholder="TrxHash">
            <button class="sub-btn" onclick="submitData('crypto')">SUBMIT</button>
        </div>
    </div>

    <div class="history-box">
        <h3 style="color:var(--cyan); margin-bottom:15px; text-transform:uppercase; font-size:14px;">History</h3>
        <div id="hList"></div>
    </div>

    <script>
    let livePrice = 0;
    let socket = null;
    let activeMethod = '';

    function toast(msg) {
        const t = document.getElementById('graphic-toast');
        document.getElementById('toast-msg').innerText = msg;
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 2500);
    }

    function copyIt(id) {
        const txt = document.getElementById(id).innerText;
        navigator.clipboard.writeText(txt).then(() => toast("Copied!"));
    }

    function openFiat(name, num) {
        activeMethod = name;
        document.getElementById('fiatTitle').innerText = name + " Payment";
        document.getElementById('targetNum').innerText = num;
        document.getElementById('fiatPop').style.display = 'flex';
    }

    function openCrypto() {
        activeMethod = 'Crypto';
        document.getElementById('cryptoPop').style.display = 'flex';
    }

    function closeAll() { 
        document.querySelectorAll('.overlay').forEach(e => e.style.display = 'none'); 
        if(socket) { 
            socket.close(); 
            socket = null; 
        }
    }

    // ১০০% রিয়েল-টাইম এবং সুপার ফাস্ট WebSocket লজিক
    function initSocket() {
        const coin = document.getElementById('coinSelect').value;
        const priceLabel = document.getElementById('priceInfo');
        const convText = document.getElementById('convertText');
        
        // রিসেট ওল্ড ডেটা
        livePrice = 0;
        priceLabel.innerText = "Connecting...";
        convText.innerText = "";

        if(!coin) {
            priceLabel.innerText = "Live Price: $0.00";
            return;
        }

        if(socket) {
            socket.close();
        }

        if(coin === 'usdt') {
            livePrice = 1.00;
            priceLabel.innerText = "Live Price: $1.00";
            calcCrypto();
            return;
        }

        // '@trade' স্ট্রিম ব্যবহার করা হয়েছে যা ১ সেকেন্ডের অনেক কম সময়ে (ইনস্ট্যান্ট) আপডেট দেয়
        socket = new WebSocket(`wss://stream.binance.com:9443/ws/${coin}@trade`);
        
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            // 'p' মানে বর্তমান ট্রেড প্রাইস
            livePrice = parseFloat(data.p);
            priceLabel.innerText = `Live Price: $${livePrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})}`;
            calcCrypto();
        };

        socket.onerror = () => {
            priceLabel.innerText = "Price Error!";
        };
        
        socket.onclose = () => {
            console.log("Socket Closed");
        };
    }

    function calcCrypto() {
        const amt = document.getElementById('cA').value;
        const convText = document.getElementById('convertText');
        if(amt && livePrice > 0) {
            const totalDollar = (amt * livePrice).toFixed(2);
            convText.innerText = `Equal to: $${totalDollar}`;
        } else {
            convText.innerText = "";
        }
    }

    function submitData(type) {
        const amtInput = type === 'fiat' ? document.getElementById('fA') : document.getElementById('cA');
        const trxInput = type === 'fiat' ? document.getElementById('fT') : document.getElementById('cH');
        
        const amt = amtInput.value;
        const trx = trxInput.value;

        if(!amt || !trx) return toast("Empty Fields!");

        const coinName = type === 'crypto' ? document.getElementById('coinSelect').value.replace('usdt','').toUpperCase() : 'BDT';

        const payload = {
            method: activeMethod,
            amount: `${amt} ${coinName}`,
            status: 'pending',
            time: new Date().toLocaleString()
        };

        let history = JSON.parse(localStorage.getItem('sm_history')) || [];
        history.unshift(payload);
        localStorage.setItem('sm_history', JSON.stringify(history));
        
        // ইনপুট ক্লিয়ার করা
        amtInput.value = '';
        trxInput.value = '';
        
        toast("Submitted!");
        closeAll();
        render();
    }

    function render() {
        const list = document.getElementById('hList');
        const history = JSON.parse(localStorage.getItem('sm_history')) || [];
        list.innerHTML = '';
        
        if(history.length === 0) {
            list.innerHTML = '<p style="text-align:center; opacity:0.5; font-size:12px;">No history found</p>';
            return;
        }

        history.forEach(item => {
            let statusHtml = item.status === 'pending' ? '<div class="spin"></div>' : 
                             item.status === 'Approved' ? '<span style="color:#00FF00; font-weight:800;">Approved</span>' : 
                             '<span style="color:#FF0000; font-weight:800;">Failed</span>';
            list.innerHTML += `
                <div class="h-item">
                    <div>
                        <p style="font-weight:800; color:var(--yellow)">${item.method}</p>
                        <small style="font-size:10px; opacity:0.6;">${item.time || ''}</small>
                    </div>
                    <div style="text-align:right">
                        <p style="font-weight:600;">${item.amount}</p>
                        ${statusHtml}
                    </div>
                </div>
            `;
        });
    }

    // পেজ লোড হলে হিস্টোরি রেন্ডার
    window.onload = render;
</script>

</body>
</html>
