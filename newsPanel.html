<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmatBit Admin | News Control Center</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0e11;
            --card: #1e2329;
            --primary: #ffff00; /* Yellow */
            --accent: #00ffff;  /* Cyan */
            --text-sec: #848e9c;
            --border: rgba(255, 255, 255, 0.08);
            --font-mon: 'Montserrat', sans-serif;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            outline: none;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .mon-900 { font-family: var(--font-mon); font-weight: 900; text-transform: uppercase; }

        /* Main Container */
        .admin-wrapper {
            width: 100%;
            max-width: 650px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .admin-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .admin-header h1 { 
            font-size: 24px; 
            color: var(--primary); 
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.3);
        }
        .admin-header p {
            font-size: 10px;
            color: var(--accent);
            margin-top: 5px;
            letter-spacing: 3px;
        }

        /* Modern Form Card */
        .news-card {
            background: var(--card);
            border-radius: 28px;
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        /* Accent Glow */
        .news-card::before {
            content: '';
            position: absolute;
            top: -50px; right: -50px;
            width: 100px; height: 100px;
            background: var(--accent);
            filter: blur(80px);
            opacity: 0.15;
        }

        .section-title {
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Input Styling */
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 8px;
            font-family: var(--font-mon);
            font-weight: 700;
        }

        .modern-input {
            width: 100%;
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid var(--border) !important;
            border-radius: 14px;
            padding: 15px;
            color: white !important;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modern-input:focus {
            border-color: var(--accent) !important;
            background: rgba(0,0,0,0.5) !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        }

        .row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Button Styling */
        .btn-post {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(255, 255, 0, 0.15);
        }

        .btn-post:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 255, 0, 0.25);
            background: #f0f000;
        }

        .btn-post:active { transform: translateY(-1px); }

        /* Management List */
        .manage-box {
            margin-top: 40px;
        }
        .list-header {
            font-size: 10px;
            color: var(--text-sec);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .news-item {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .news-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
        }

        .news-info h4 { font-size: 13px; color: #fff; margin-bottom: 4px; }
        .news-info p { font-size: 10px; color: var(--text-sec); }

        .btn-delete {
            width: 35px; height: 35px;
            border-radius: 10px;
            background: rgba(246, 70, 93, 0.1);
            color: #f6465d;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
            border: 1px solid rgba(246, 70, 93, 0.2);
        }
        .btn-delete:hover { background: #f6465d; color: white; }

        /* Custom Toast */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: var(--card);
            border-left: 4px solid var(--accent);
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="admin-wrapper">
        <div class="admin-header">
            <h1 class="mon-900">News Control Center</h1>
            <p class="mon-900">SmatBit Ecosystem Management</p>
        </div>

        <div class="news-card">
            <h3 class="section-title mon-900">
                <i class="fas fa-plus-circle"></i> Create New Broadcast
            </h3>

            <div class="input-group">
                <label>HEADLINE / TITLE</label>
                <input type="text" id="newsTitle" class="modern-input" placeholder="Enter news headline...">
            </div>

            <div class="row-grid">
                <div class="input-group">
                    <label>BANNER IMAGE URL</label>
                    <input type="text" id="newsImg" class="modern-input" placeholder="https://...">
                </div>
                <div class="input-group">
                    <label>CATEGORY</label>
                    <input type="text" id="newsCat" class="modern-input" placeholder="e.g. Update">
                </div>
            </div>

            <div class="input-group">
                <label>FULL NEWS CONTENT</label>
                <textarea id="newsContent" class="modern-input" rows="5" style="resize: none;" placeholder="Write full details here..."></textarea>
            </div>

            <button class="btn-post mon-900" onclick="uploadNews()">
                <i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Broadcast News
            </button>
        </div>

        <div class="manage-box">
            <h4 class="list-header mon-900">Recently Published</h4>
            <div id="adminNewsList">
                </div>
        </div>
    </div>

<script>
    // --- Configuration ---
    const firebaseConfig = { 
        apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
        databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- Core Functions ---
    async function uploadNews() {
        const title = document.getElementById('newsTitle').value;
        const desc = document.getElementById('newsContent').value;
        const img = document.getElementById('newsImg').value;
        const cat = document.getElementById('newsCat').value;

        if(!title || !desc) return showToast("Headline and Content are required!", "#f6465d");

        const id = "NEWS_" + Date.now();
        const data = {
            id, title,
            image: img || "",
            category: cat || "Announcement",
            description: desc,
            timestamp: Date.now()
        };

        try {
            await db.ref('news_feed/' + id).set(data);
            showToast("News Broadcasted Successfully!", "#00ffff");
            // Clear inputs
            document.getElementById('newsTitle').value = "";
            document.getElementById('newsContent').value = "";
            document.getElementById('newsImg').value = "";
            document.getElementById('newsCat').value = "";
        } catch (e) {
            showToast("Error broadcasting news.", "#f6465d");
        }
    }

    // --- Real-time List Listener ---
    db.ref('news_feed').on('value', snap => {
        const container = document.getElementById('adminNewsList');
        container.innerHTML = "";
        const data = snap.val() || {};
        const items = Object.keys(data).sort((a,b) => data[b].timestamp - data[a].timestamp);

        if(items.length === 0) {
            container.innerHTML = `<p style="text-align:center; font-size:12px; color:gray; padding:20px;">No news published yet.</p>`;
            return;
        }

        items.forEach(k => {
            const news = data[k];
            container.innerHTML += `
                <div class="news-item">
                    <div class="news-info">
                        <h4>${news.title.substring(0, 40)}${news.title.length > 40 ? '...' : ''}</h4>
                        <p>${news.category} • ${new Date(news.timestamp).toLocaleDateString()}</p>
                    </div>
                    <div class="btn-delete" onclick="deleteNews('${k}')">
                        <i class="fas fa-trash-alt"></i>
                    </div>
                </div>
            `;
        });
    });

    async function deleteNews(id) {
        if(confirm("Are you sure you want to delete this news?")) {
            await db.ref('news_feed/' + id).remove();
            showToast("News Deleted", "#f6465d");
        }
    }

    function showToast(msg, color) {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast mon-900';
        t.style.borderLeftColor = color;
        t.style.fontSize = "11px";
        t.innerText = msg;
        container.appendChild(t);
        setTimeout(() => {
            t.style.opacity = "0";
            setTimeout(() => t.remove(), 500);
        }, 3000);
    }
</script>
</body>
</html>
