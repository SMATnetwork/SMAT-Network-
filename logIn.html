<style>
    :root {
        /* ডে-মোড কালার প্যালেট */
        --primary: #f3ba2f;           /* আপনার সিগনেচার গোল্ডেন কালার */
        --bg: #f8f9fa;               /* হালকা গ্রে ব্যাকগ্রাউন্ড */
        --card: rgba(255, 255, 255, 0.98); /* সাদা কার্ড */
        --text-main: #1e2329;        /* গাঢ় টেক্সট */
        --text-muted: #5e6673;       /* হালকা টেক্সট */
        --input-bg: #f1f4f7;         /* ইনপুট ফিল্ড ব্যাকগ্রাউন্ড */
        --border-color: rgba(0, 0, 0, 0.08);
    }

    /* ক্লিক গ্লিচ বন্ধ এবং ইন্টারফেস রিসেট */
    * { 
        margin: 0; padding: 0; box-sizing: border-box; 
        font-family: 'Montserrat', sans-serif;
        -webkit-tap-highlight-color: transparent;
        outline: none !important;
    }

    body {
        background-color: var(--bg);
        height: 100vh; display: flex;
        justify-content: center; align-items: center;
        overflow: hidden; position: relative;
    }

    /* --- Digital Graphics Canvas --- */
    #graphicsCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.8; /* জীবন্ত ফ্লো দেখার জন্য অপাসিটি বাড়ানো হয়েছে */
    filter: blur(0.5px); /* হালকা গ্লো ইফেক্ট */
    }
    

    /* ওল্ড স্কুল ডিজিটাল ফিল্টার - ডে মোড এডজাস্টেড */
    .scanlines {
        position: absolute; width: 100%; height: 100%;
        background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.02) 50%), 
                    linear-gradient(90deg, rgba(243, 186, 47, 0.03), rgba(0, 0, 0, 0.01), rgba(243, 186, 47, 0.03));
        background-size: 100% 4px, 3px 100%;
        z-index: 2; pointer-events: none;
    }

    /* --- Auth Card --- */
    .auth-container {
        position: relative; z-index: 10;
        width: 90%; max-width: 420px;
        background: none;
        padding: 20px 20px;
        border-radius: 32px;
        border: 1px solid var(--border-color); 
        text-align: center;
        backdrop-filter: blur(10px);
    }

    .logo-circle {
        width: 80px; height: 80px; margin: 0 auto 20px;
        background: #fff; border-radius: 50%; overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08); /* লোগোর নিচে হালকা ডেপথ */
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    .brand-name { font-size: 28px; font-weight: 900; color: var(--text-main); margin-bottom: 8px; }
    .brand-name span { color: var(--primary); }
    .sub-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 35px; }

    .form-group { text-align: left; margin-bottom: 25px; }
    label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

    input {
        width: 100%; padding: 18px;
        background: silver; border: 1px solid transparent;
        border-radius: 14px; color: var(--text-main); font-size: 16px;
        transition: 0.3s;
    }
    input::placeholder { color: #929aa5; }
    input:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 10px rgba(243, 186, 47, 0.1); }

    .pass-box { position: relative; }
    .eye-icon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; padding: 5px; }

    #actionBtn {
        width: 100%; padding: 18px;
        background: var(--primary); color: #000;
        border: none; border-radius: 14px;
        font-size: 18px; font-weight: 900;
        cursor: pointer; margin-top: 10px; transition: 0.3s;
        box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3);
    }
    #actionBtn:active { transform: scale(0.98); }
    #actionBtn:disabled { background: #e6e9ed; color: #b7bdc6; cursor: not-allowed; box-shadow: none; }

    /* লিঙ্ক গ্লিচ বন্ধ করার মাস্টার ফিক্স */
    .auth-footer { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border-color); }
    .link-primary { color: green; cursor: pointer; font-weight: 900; font-size: 14px; background: none !important; text-decoration: none; }
    .link-secondary { color: var(--text-muted); cursor: pointer; font-weight: 900;font-size: 13px; display: block; margin-top: 15px; background: none !important; text-decoration: none; }

    /* টোস্ট - ডে মোড */
    #customToast {
        position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
        background: #ffffff; color: var(--text-main); padding: 16px 25px; border-radius: 12px;
        z-index: 1000; border-left: 5px solid var(--primary); transition: 0.5s;
        display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        font-weight: 600;
    }
    #customToast.active { top: 30px; }
</style>

</head>
<body>

<div class="scanlines"></div>
<canvas id="graphicsCanvas"></canvas>

<div id="customToast">
    <i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i>
    <span id="toastMsg">Securing connection...</span>
</div>

<div class="auth-container">
    <div class="logo-circle">
        <img src="assets/logos/oxsmat.png" alt="SMAT">
    </div>
    <h1 class="brand-name">SMAT <span>EXCHANGE</span></h1>
    <p class="sub-desc" id="uiLabel">Welcome to SMAT Exchange </p>

    <div class="form-group">
        <label>Account Email</label>
        <input type="email" id="email" placeholder="welcome@smat.com">
    </div>

    <div class="form-group">
        <label>Security Key <span id="passState" style="float: right; text-transform: none;"></span></label>
        <div class="pass-box">
            <input type="password" id="password" placeholder="••••••••" oninput="liveCheck()">
            <i class="fa-solid fa-eye eye-icon" onclick="togglePass()"></i>
        </div>
    </div>

    <button id="actionBtn" onclick="executeAuth()">LOGIN</button>

    <div class="auth-footer">
        <span class="link-primary" id="uiSwitch" onclick="switchUI()">Register new account</span>
        <span class="link-secondary" onclick="forgotPass()">Recover password?</span>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE",
        authDomain: "smat-exchange.firebaseapp.com",
        projectId: "smat-exchange",
        storageBucket: "smat-exchange.firebasestorage.app",
        messagingSenderId: "836334569396",
        appId: "1:836334569396:web:679effe640b3453412d4e1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // --- ১. Pure Code Graphics (Optimized for SmatBit) ---
const canvas = document.getElementById('graphicsCanvas');
const ctx = canvas.getContext('2d');
let w, h;

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const nodes = [];

class Node {
    constructor(x, y, vx, vy) {
        this.x = x || Math.random() * w;
        this.y = y || Math.random() * h;
        this.vx = vx || (Math.random() - 0.5) * 1.5; 
        this.vy = vy || (Math.random() - 0.5) * 1.5;
        this.radius = 18; // সামান্য ছোট করা হয়েছে পারফরম্যান্সের জন্য
        this.color = Math.random() > 0.5 ? "#f3ba2f" : "#00ffff"; 
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        
        // শ্যাডো ব্লার ব্রাউজারকে স্লো করে, তাই এটি কমিয়ে ৫ করা হয়েছে
        ctx.shadowBlur = 5; 
        ctx.shadowColor = this.color;
        ctx.globalAlpha = 0.7; 
        ctx.fill();
        ctx.shadowBlur = 0; // ড্রয়িং শেষে সাথে সাথে রিসেট
        ctx.globalAlpha = 1;

        // Montserrat 900 ফন্ট
        ctx.font = "900 9px Montserrat"; 
        ctx.fillStyle = "#000000"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("SMAT", this.x, this.y);
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > w) this.vx *= -1;
        if (this.y < 0 || this.y > h) this.vy *= -1;
    }
}

function createSNodes() {
    const totalNodes = 20; // ১৫ থেকে বাড়িয়ে ২৫ করা হলো, ল্যাগ হবে না
    const centerX = w / 2;
    const centerY = h / 2;
    for (let i = 0; i < totalNodes; i++) {
        let t = (i / totalNodes) * Math.PI * 2.5; 
        let xOffset = Math.sin(t) * 100;
        let yOffset = Math.cos(t * 0.5) * 150;
        nodes.push(new Node(centerX + xOffset, centerY + yOffset));
    }
}

createSNodes();

function animate() {
    // স্ক্রিন ক্লিয়ারিং এবং ট্রেইল
    ctx.fillStyle = "rgba(248, 249, 250, 0.3)"; 
    ctx.fillRect(0, 0, w, h);

    nodes.forEach((n, index) => {
        n.update();
        n.draw();

        for (let j = index + 1; j < nodes.length; j++) {
            const n2 = nodes[j];
            const dist = Math.hypot(n.x - n2.x, n.y - n2.y);

            if (dist < 180) {
                ctx.beginPath();
                ctx.moveTo(n.x, n.y);
                ctx.lineTo(n2.x, n2.y);
                
                const grad = ctx.createLinearGradient(n.x, n.y, n2.x, n2.y);
                grad.addColorStop(0, n.color);
                grad.addColorStop(1, n2.color);
                
                ctx.strokeStyle = grad;
                // অপাসিটি ক্যালকুলেশন ফিক্স করা হয়েছে
                ctx.globalAlpha = Math.max(0, 1 - (dist / 180));
                ctx.lineWidth = 1; 
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }
    });
    requestAnimationFrame(animate);
}
animate();


    // --- ২. আপনার অরিজিনাল লজিক (SMAT ID, Referral, Firebase) ---
    let loginMode = true;
    const urlParams = new URLSearchParams(window.location.search);
    const referralID = urlParams.get('ref') || null;

    window.popToast = (msg, err = false) => {
        const t = document.getElementById('customToast');
        document.getElementById('toastMsg').innerText = msg;
        t.style.borderLeftColor = err ? "#ff4d4d" : "#00ff88";
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 3000);
    };

    window.togglePass = () => {
        const p = document.getElementById('password');
        p.type = p.type === 'password' ? 'text' : 'password';
    };

    window.liveCheck = () => {
        const val = document.getElementById('password').value;
        const state = document.getElementById('passState');
        const btn = document.getElementById('actionBtn');
        const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;

        if(val === "") { state.innerText = ""; return; }
        if(regex.test(val)) {
            state.innerHTML = '<i class="fa-solid fa-circle-check"></i> Strong';
            state.style.color = "#00ff88";
            btn.disabled = false;
        } else {
            state.innerText = "Min 8 Chars (Letter + Number)";
            state.style.color = "#ff4d4d";
            if(!loginMode) btn.disabled = true;
        }
    };

    window.switchUI = () => {
        loginMode = !loginMode;
        document.getElementById('uiLabel').innerText = loginMode ? "Welcome to SMAT Exchange " : "All in One Exchange Platform";
        document.getElementById('actionBtn').innerText = loginMode ? "LOGIN" : "REGISTER";
        document.getElementById('uiSwitch').innerText = loginMode ? "Register new account" : "Sign in instead";
        document.getElementById('passState').innerText = "";
    };

    const getSmatID = async () => {
        const counterRef = ref(db, 'counters/lastSmatId');
        const result = await runTransaction(counterRef, (v) => (v || 100000) + 1);
        return "SMAT" + result.snapshot.val();
    };

    window.executeAuth = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if(!email || !pass) return popToast("Details missing!", true);

        popToast("Connecting to SMAT...");
        try {
            if (loginMode) {
                const res = await signInWithEmailAndPassword(auth, email, pass);
                if (res.user.emailVerified) {
                    const snap = await get(ref(db, 'users/' + res.user.uid));
                    if(snap.exists()) localStorage.setItem('smatID', snap.val().smatID);
                    localStorage.setItem('isLoggedIn', 'true');
                    window.location.href = "home.html"; 
                } else popToast("Please verify your email address!", true);
            } else {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                const sID = await getSmatID();
                await set(ref(db, 'users/' + res.user.uid), {
                    email, smatID: sID, kycStatus: 'unverified', referredBy: referralID, createdAt: new Date().toISOString()
                });
                await sendEmailVerification(res.user);
                popToast("Verification link send to Gmail!");
            }
        } catch (e) { popToast(e.message, true); }
    };

    window.forgotPass = async () => {
        const email = document.getElementById('email').value;
        if(!email) return popToast("Enter email first!", true);
        try {
            await sendPasswordResetEmail(auth, email);
            popToast("Recovery instructions sent!");
        } catch (e) { popToast(e.message, true); }
    };
</script>
</body>
</html>
