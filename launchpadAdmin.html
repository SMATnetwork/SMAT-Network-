<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmatBit | Launchpad Manager</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --primary: #f0b90b; --border: rgba(255,255,255,0.1); --text: #eaeaea; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: var(--primary); text-align: center; text-transform: uppercase; margin-bottom: 30px; }
        
        .admin-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #848e9c; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; background: #0b0e11; border: 1px solid var(--border); border-radius: 10px; color: white; outline: none; box-sizing: border-box; transition: 0.3s; }
        input:focus, textarea:focus { border-color: var(--primary); }

        .btn-push { background: var(--primary); color: #000; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; font-size: 14px; text-transform: uppercase; }
        .btn-push:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(240, 185, 11, 0.3); }

        hr { border: 0; border-top: 1px solid var(--border); margin: 30px 0; }
        .list-item { background: #0b0e11; padding: 15px; border-radius: 12px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .info b { color: var(--primary); }
        .btn-del { background: #f6465d; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Launchpad Manager</h1>

        <div class="admin-card">
            <div class="form-group">
                <label>Token Name</label>
                <input type="text" id="lpName" placeholder="e.g. SmatBit Gold">
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Symbol</label>
                    <input type="text" id="lpSymbol" placeholder="SBG">
                </div>
                <div style="flex: 1;">
                    <label>Lock Token Required</label>
                    <input type="text" id="lpLockToken" placeholder="SMB">
                </div>
            </div>
            <div class="form-group">
                <label>Logo URL</label>
                <input type="text" id="lpLogo" placeholder="https://domain.com/logo.png">
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Total Reward Pool</label>
                    <input type="number" id="lpPool" placeholder="500000">
                </div>
                <div style="flex: 1;">
                    <label>Duration (Days)</label>
                    <input type="number" id="lpDays" placeholder="30">
                </div>
            </div>
            <div class="form-group">
                <label>Project Description</label>
                <textarea id="lpDesc" rows="4" placeholder="Write about the project..."></textarea>
            </div>
            
            <button class="btn-push" onclick="pushLaunchpad()">Deploy Launchpad</button>
            
            <hr>
            <h3 style="font-size: 14px; color: #848e9c; text-transform: uppercase;">Manage Existing</h3>
            <div id="lpList"></div>
        </div>
    </div>

<script>
// --- FIREBASE CONFIG ---
const firebaseConfig = { 
    apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
    authDomain: "smat-exchange.firebaseapp.com", 
    projectId: "smat-exchange", 
    databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- PUSH DATA ---
function pushLaunchpad() {
    const id = "LP_" + Date.now();
    const days = parseInt(document.getElementById('lpDays').value);
    
    const data = {
        tokenName: document.getElementById('lpName').value,
        tokenSymbol: document.getElementById('lpSymbol').value,
        logoPath: document.getElementById('lpLogo').value,
        lockToken: document.getElementById('lpLockToken').value,
        poolSize: document.getElementById('lpPool').value,
        description: document.getElementById('lpDesc').value,
        startTime: Date.now(),
        endTime: Date.now() + (days * 24 * 60 * 60 * 1000),
        globalLocked: 0
    };

    if(!data.tokenName || !days || !data.tokenSymbol) {
        return alert("Please fill all required fields!");
    }
    
    db.ref('launchpad_list/' + id).set(data).then(() => {
        alert("Launchpad is now Live!");
        clearForm();
    });
}

function clearForm() {
    document.querySelectorAll('input, textarea').forEach(el => el.value = "");
}

// --- REALTIME LIST ---
db.ref('launchpad_list').on('value', snap => {
    const list = document.getElementById('lpList');
    list.innerHTML = "";
    const items = [];
    snap.forEach(child => { items.push({key: child.key, ...child.val()}); });
    
    // সর্বশেষটি সর্বপ্রথমে দেখানোর জন্য
    items.sort((a, b) => b.startTime - a.startTime).forEach(item => {
        list.innerHTML += `
            <div class="list-item">
                <div class="info">
                    <b>${item.tokenSymbol}</b><br>
                    <small style="color:#848e9c; font-size:10px;">Pool: ${item.poolSize}</small>
                </div>
                <button class="btn-del" onclick="deleteLP('${item.key}')">Remove</button>
            </div>`;
    });
});

function deleteLP(id) {
    if(confirm("Are you sure you want to delete this Launchpad?")) {
        db.ref('launchpad_list/' + id).remove();
    }
}
</script>
</body>
</html>
