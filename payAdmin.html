<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmatBit | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --yellow: #FFFF00; --cyan: #00FFFF; --bg: #050505; --card: #111; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        
        body { background-color: var(--bg); color: white; padding: 20px; }
        
        .admin-container { max-width: 1100px; margin: 0 auto; }
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; border-bottom: 2px solid var(--cyan); margin-bottom: 30px;
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--yellow); }
        .stats-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; margin-bottom: 30px; 
        }
        .stat-card { 
            background: var(--card); padding: 20px; border-radius: 12px; 
            border: 1px solid #222; text-align: center;
        }
        .stat-card h3 { font-size: 14px; color: var(--cyan); text-transform: uppercase; margin-bottom: 10px; }
        .stat-card p { font-size: 28px; font-weight: 800; }

        /* Request Table */
        .table-container { background: var(--card); border-radius: 15px; overflow-x: auto; border: 1px solid #222; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        th { background: #1a1a1a; padding: 15px; color: var(--yellow); font-size: 13px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #222; font-size: 14px; }
        tr:hover { background: #161616; }

        .method-badge { 
            padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; 
            background: var(--cyan); color: #000; 
        }
        .crypto-badge { background: #a333ff; color: #fff; }

        /* Action Buttons */
        .btn { 
            padding: 8px 15px; border: none; border-radius: 5px; 
            font-weight: 700; cursor: pointer; font-size: 12px; transition: 0.3s;
        }
        .btn-approve { background: #00FF00; color: #000; margin-right: 5px; }
        .btn-approve:hover { background: #00cc00; box-shadow: 0 0 10px #00FF00; }
        .btn-reject { background: #FF0000; color: #fff; }
        .btn-reject:hover { background: #cc0000; box-shadow: 0 0 10px #FF0000; }

        .status-tag { font-weight: 700; text-transform: uppercase; font-size: 12px; }
        .pending { color: var(--yellow); }
        .approved { color: #00FF00; }
        .fail { color: #FF0000; }

        /* Filter Tabs */
        .filters { display: flex; gap: 10px; margin-bottom: 20px; }
        .filter-btn { 
            background: transparent; border: 1px solid #444; color: #ccc; 
            padding: 8px 20px; border-radius: 20px; cursor: pointer; 
        }
        .filter-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0, 255, 255, 0.05); }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <div class="logo">SmatBit <span style="color:var(--cyan)">ADMIN</span></div>
            <div id="admin-info">Welcome, Sadekul Islam</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><h3>Total Received</h3><p id="totalRec">0</p></div>
            <div class="stat-card"><h3>Pending Requests</h3><p id="pendingCount" style="color:var(--yellow)">0</p></div>
            <div class="stat-card"><h3>Approved</h3><p id="approvedCount" style="color:#00FF00">0</p></div>
        </div>

        <div class="filters">
            <button class="filter-btn active">All Requests</button>
            <button class="filter-btn">Pending</button>
            <button class="filter-btn">Fiat</button>
            <button class="filter-btn">Crypto</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>User Email</th>
                        <th>Method</th>
                        <th>Amount</th>
                        <th>TrxID / Hash</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <!-- Data will load here via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK (Compat mode for simple usage) -->
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>

    <script>
        // আপনার Firebase Config এখানে বসান
        /*
        const firebaseConfig = { ... };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        */

        // ডাটা লোড করার ফাংশন (Real-time)
        function loadRequests() {
            // পেমেন্ট কালেকশন থেকে ডাটা নিবে (সময় অনুযায়ী সাজানো)
            db.collection("payments").orderBy("time", "desc").onSnapshot((snapshot) => {
                const tbody = document.getElementById('adminTableBody');
                tbody.innerHTML = '';
                
                let pending = 0, approved = 0, total = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;
                    total++;

                    if(data.status === 'pending') pending++;
                    if(data.status === 'Approved') approved++;

                    const methodClass = data.method === 'crypto' ? 'method-badge crypto-badge' : 'method-badge';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${data.time}</td>
                            <td>${data.userEmail || 'User'}</td>
                            <td><span class="${methodClass}">${data.method.toUpperCase()}</span></td>
                            <td style="font-weight:700">${data.amount}</td>
                            <td style="font-family:monospace; font-size:12px; color:#aaa;">${data.trxID || data.trxHash}</td>
                            <td><span class="status-tag ${data.status.toLowerCase()}">${data.status}</span></td>
                            <td>
                                ${data.status === 'pending' ? `
                                    <button class="btn btn-approve" onclick="updateStatus('${id}', 'Approved')">Approve</button>
                                    <button class="btn btn-reject" onclick="updateStatus('${id}', 'Fail')">Reject</button>
                                ` : `<span style="opacity:0.3">Done</span>`}
                            </td>
                        </tr>
                    `;
                });

                // আপডেট স্ট্যাটাস কার্ডস
                document.getElementById('totalRec').innerText = total;
                document.getElementById('pendingCount').innerText = pending;
                document.getElementById('approvedCount').innerText = approved;
            });
        }

        // স্ট্যাটাস আপডেট করার ফাংশন
        function updateStatus(docId, newStatus) {
            if(confirm(`Are you sure you want to set this as ${newStatus}?`)) {
                db.collection("payments").doc(docId).update({
                    status: newStatus
                }).then(() => {
                    console.log("Status Updated!");
                }).catch((error) => {
                    alert("Error: " + error.message);
                });
            }
        }

        // পেজ লোড হলে ফাংশন কল হবে
        // window.onload = loadRequests;
    </script>
</body>
</html>
