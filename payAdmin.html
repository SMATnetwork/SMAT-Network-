<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmatBit Premium Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --yellow: #FFFF00; --cyan: #00FFFF; --bg: #0a0a0a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg); color: white; padding: 20px; }

        /* --- Custom Graphic Toast Notification --- */
        #custom-toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #111, #222);
            border: 2px solid var(--cyan);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }
        #custom-toast.show { bottom: 40px; }
        .toast-icon { background: var(--cyan); width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; }
        .toast-msg { color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; }

        /* --- Payment UI Design --- */
        .gateway-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 800px; margin: 40px auto; }
        .pay-card { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 15px; cursor: pointer; text-align: center; transition: 0.3s; }
        .pay-card:hover { border-color: var(--cyan); transform: translateY(-5px); }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; backdrop-filter: blur(10px); align-items: center; justify-content: center; }
        .toast-popup { width: 90%; max-width: 400px; background: #111; border: 2px solid var(--cyan); border-radius: 25px; padding: 30px; position: relative; animation: popUp 0.3s ease-out; }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; color: var(--yellow); cursor: pointer; }
        
        .copy-box { background: rgba(255,255,0,0.05); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin: 20px 0; border: 1px dashed var(--yellow); }
        .copy-btn { background: var(--yellow); color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 12px; }

        input, select { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; font-weight: 600; }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(90deg, var(--cyan), #00a0a0); border: none; color: #000; font-weight: 800; border-radius: 10px; margin-top: 15px; cursor: pointer; }

        /* Payment History Status */
        .history-card { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .spinner { width: 18px; height: 18px; border: 3px solid #333; border-top: 3px solid var(--cyan); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-app { color: #00FF00; font-weight: 800; }
        .status-fail { color: #FF0000; font-weight: 800; }
    </style>
</head>
<body>

    <h2 style="text-align:center; color: var(--yellow); letter-spacing: 2px;">SMATBIT GATEWAY</h2>

    <!-- Graphic Toast Notification Holder -->
    <div id="custom-toast">
        <div class="toast-icon">✓</div>
        <div class="toast-msg" id="toast-text">Copied Successfully!</div>
    </div>

    <div class="gateway-grid">
        <div class="pay-card" onclick="openPayment('bkash', '0192888')">
            <p style="font-weight: 800; color: #E2136E;">bKash</p>
        </div>
        <div class="pay-card" onclick="openPayment('nagad', '0170000')">
            <p style="font-weight: 800; color: #F7941D;">Nagad</p>
        </div>
        <div class="pay-card" onclick="openCrypto()">
            <p style="font-weight: 800; color: var(--cyan);">Crypto</p>
        </div>
    </div>

    <div style="max-width:800px; margin: 40px auto;">
        <h3 style="color: var(--cyan); margin-bottom: 15px;">Transactions</h3>
        <div id="historyList"></div>
    </div>

    <!-- Mobile Banking Popup -->
    <div id="fiatOverlay" class="overlay">
        <div class="toast-popup">
            <span class="close-btn" onclick="closePopups()">&times;</span>
            <h3 id="popTitle" style="color:var(--cyan);">Payment</h3>
            <p style="font-size:12px; opacity:0.7; margin-top:5px;">Send Money (Personal)</p>
            
            <div class="copy-box">
                <span id="targetNumber" style="font-weight:800; letter-spacing:1px;">0192888</span>
                <button class="copy-btn" onclick="copyText('targetNumber')">COPY</button>
            </div>

            <input type="number" id="fiatAmount" placeholder="Amount (BDT)">
            <input type="text" id="fiatTrx" placeholder="Transaction ID (TrxID)">
            <button class="submit-btn" onclick="submitPayment('fiat')">SUBMIT PAYMENT</button>
        </div>
    </div>

    <!-- Crypto Popup -->
    <div id="cryptoOverlay" class="overlay">
        <div class="toast-popup">
            <span class="close-btn" onclick="closePopups()">&times;</span>
            <h3 style="color:var(--cyan);">Crypto Gateway</h3>
            
            <select id="coinSelect" onchange="fetchCryptoPrice()">
                <option value="">Select Coin</option>
                <option value="BNBUSDT">BNB (BSC)</option>
                <option value="ETHUSDT">ETH (Ethereum)</option>
                <option value="USDT">USDT (TRC20)</option>
            </select>

            <p id="liveRate" style="font-size:12px; color:var(--yellow); margin:10px 0;"></p>

            <div class="copy-box">
                <span id="walletAddr" style="font-size:10px;">0x71C7656EC7ab88b098defB751B7401B5f6d8976F</span>
                <button class="copy-btn" onclick="copyText('walletAddr')">COPY</button>
            </div>

            <input type="number" id="cryptoAmount" placeholder="Enter Coin Amount">
            <input type="text" id="cryptoHash" placeholder="Transaction Hash">
            <button class="submit-btn" onclick="submitPayment('crypto')">SUBMIT CRYPTO</button>
        </div>
    </div>

    <script>
        // --- ১. গ্রাফিক টোস্ট নোটিফিকেশন লজিক ---
        function showGraphicToast(text) {
            const toast = document.getElementById('custom-toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // --- ২. কপি বাটন লজিক (১০০% কাজ করবে) ---
        function copyText(id) {
            const text = document.getElementById(id).innerText;
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            showGraphicToast("Copied to Clipboard!");
        }

        // --- ৩. পেমেন্ট পপআপ কন্ট্রোল ---
        function openPayment(method, num) {
            document.getElementById('popTitle').innerText = method.toUpperCase() + " PAYMENT";
            document.getElementById('targetNumber').innerText = num;
            document.getElementById('fiatOverlay').style.display = 'flex';
        }

        function openCrypto() {
            document.getElementById('cryptoOverlay').style.display = 'flex';
        }

        function closePopups() {
            document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
        }

        // --- ৪. বাইন্যান্স এপিআই (রিয়েল প্রাইস) ---
        async function fetchCryptoPrice() {
            const coin = document.getElementById('coinSelect').value;
            if(!coin) return;
            try {
                const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${coin}`);
                const data = await res.json();
                document.getElementById('liveRate').innerText = `1 ${coin.replace('USDT','')} = $${parseFloat(data.price).toFixed(2)}`;
            } catch(e) {
                document.getElementById('liveRate').innerText = "Price unavailable";
            }
        }

        // --- ৫. সাবমিট এবং হিস্টরি ---
        function submitPayment(type) {
            // এখানে ডাটাবেসে পাঠানোর কোড হবে (যেমন Firebase)
            showGraphicToast("Submission Received!");
            
            // ডামি হিস্টরি আপডেট
            const list = document.getElementById('historyList');
            const newRow = `
                <div class="history-card">
                    <div>
                        <p style="font-weight:800; color:var(--yellow)">${type.toUpperCase()}</p>
                        <small>${new Date().toLocaleTimeString()}</small>
                    </div>
                    <div style="text-align:right">
                        <p>Pending Review</p>
                        <div class="spinner"></div>
                    </div>
                </div>
            `;
            list.innerHTML = newRow + list.innerHTML;
            closePopups();
        }
    </script>
</body>
</html>
