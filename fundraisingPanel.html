<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmatBit Admin | Fundraising Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #ffff00;
            --accent: #00ffff; --border: rgba(255, 255, 255, 0.08);
            --font-mont: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 700; }
        body { background: var(--bg); color: white; padding: 20px; }

        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .admin-header h1 { font-family: var(--font-mont); color: var(--primary); font-size: 20px; }

        /* Form Styling */
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--accent); margin-bottom: 5px; text-transform: uppercase; }
        input, textarea, select { width: 100%; background: #0b0e11; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; outline: none; font-size: 13px; }
        input:focus { border-color: var(--accent); }

        .btn-add { width: 100%; background: var(--primary); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        /* Project History List */
        .project-item { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border-left: 5px solid var(--accent); transition: 0.3s; cursor: pointer; }
        .project-item:hover { transform: scale(1.01); background: #252b32; }
        .proj-info h3 { font-size: 15px; font-family: var(--font-mont); }
        .proj-info p { font-size: 10px; color: #848e9c; }

        /* Graphic Popup Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-card { background: var(--card); border: 1px solid var(--accent); border-radius: 25px; padding: 25px; width: 100%; max-width: 450px; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-card h2 { font-family: var(--font-mont); color: var(--primary); text-align: center; margin-bottom: 15px; }

        .dist-list { margin-top: 20px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
        .send-btn { background: var(--accent); color: #000; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 10px; }
        .send-btn.done { background: #555; color: white; cursor: default; }

        /* Toast */
        #toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; }
        .g-toast { background: var(--card); border-left: 4px solid var(--accent); padding: 15px 25px; border-radius: 12px; color: white; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="toast-box"></div>

    <div class="admin-header">
        <h1>PROJECT MANAGER</h1>
        <div id="totalProj" style="font-size: 12px; color: var(--accent);">0 Projects</div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 15px; font-size: 14px;">UPLOAD NEW PROJECT</h3>
        <div class="input-group">
            <label>Project Title</label>
            <input type="text" id="pTitle" placeholder="e.g. SmatBit Mainnet">
        </div>
        <div class="input-group">
            <label>Token Symbol (Dynamic Path)</label>
            <input type="text" id="pSym" placeholder="e.g. smat (small letter)">
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <div class="input-group"><label>Logo URL</label><input type="text" id="pLogo"></div>
            <div class="input-group"><label>Vesting Rule</label><input type="text" id="pVesting"></div>
        </div>
        <button class="btn-add" onclick="uploadProject()">LAUNCH PROJECT</button>
    </div>

    <h3 style="margin-bottom: 15px; font-size: 14px; color: var(--accent);">PROJECT HISTORY</h3>
    <div id="projectList"></div>

    <div class="modal-overlay" id="projModal">
        <div class="modal-card">
            <h2 id="mTitle">PROJECT DETAILS</h2>
            <div id="mDetails" style="font-size: 11px; color: #848e9c; line-height: 1.6; border-bottom: 1px solid var(--border); padding-bottom: 15px;"></div>
            
            <div class="dist-list">
                <h3 style="font-size: 12px; margin-bottom: 10px; color: var(--primary);">CONTRIBUTORS & DISTRIBUTION</h3>
                <div id="contributorList"></div>
            </div>

            <button class="btn-add" style="background:none; border:1px solid var(--accent); color:var(--accent); margin-top:20px;" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

<script>
const firebaseConfig = { 
    apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
    databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentProjects = [];

// --- 1. Upload Project ---
async function uploadProject() {
    const title = document.getElementById('pTitle').value;
    const sym = document.getElementById('pSym').value.toLowerCase(); // ছোট হাতের পাথ নিশ্চিত করা
    const logo = document.getElementById('pLogo').value;
    const vesting = document.getElementById('pVesting').value;

    if(!title || !sym) return showToast("Title and Symbol Required!");

    const pId = "PROJ_" + Date.now();
    const data = {
        id: pId, title, sym, logo, vesting,
        timestamp: Date.now(),
        status: 'active'
    };

    await db.ref('fundraising_history/' + pId).set(data);
    // বর্তমানে ইউজার পেজে যেটা লাইভ দেখাবে
    await db.ref('active_fundraising').set(data);

    showToast("Project Launched Successfully!");
    clearForm();
}

// --- 2. Load History (Latest First) ---
db.ref('fundraising_history').on('value', snap => {
    const list = document.getElementById('projectList');
    list.innerHTML = "";
    const data = snap.val() || {};
    currentProjects = Object.keys(data).map(k => data[k]).sort((a,b) => b.timestamp - a.timestamp);
    
    document.getElementById('totalProj').innerText = currentProjects.length + " Projects";

    currentProjects.forEach(p => {
        list.innerHTML += `
            <div class="project-item" onclick="openDetails('${p.id}')">
                <div class="proj-info">
                    <h3>${p.title}</h3>
                    <p>Symbol: ${p.sym.toUpperCase()} | Path: ${p.sym}_balance</p>
                </div>
                <i class="fas fa-chevron-right" style="color:var(--accent)"></i>
            </div>
        `;
    });
});

// --- 3. Distribution Modal Logic ---
async function openDetails(pId) {
    const proj = currentProjects.find(p => p.id === pId);
    document.getElementById('mTitle').innerText = proj.title;
    document.getElementById('mDetails').innerHTML = `
        ID: ${proj.id}<br>
        Dynamic Path: <b>${proj.sym}_balance</b><br>
        Vesting: ${proj.vesting}
    `;

    // Load Contributors
    const contList = document.getElementById('contributorList');
    contList.innerHTML = "Loading contributors...";
    
    const snap = await db.ref('fundraising_contributions/' + pId).once('value');
    const contributors = snap.val() || {};
    
    contList.innerHTML = "";
    if(Object.keys(contributors).length === 0) {
        contList.innerHTML = "<p style='text-align:center; padding:20px;'>No contributions found.</p>";
    }

    Object.keys(contributors).forEach(uid => {
        const user = contributors[uid];
        contList.innerHTML += `
            <div class="user-row">
                <div>
                    <b>${user.smat_id}</b><br>
                    <span style="font-size:10px">Invested: ${user.amount} USDT</span>
                </div>
                <button class="send-btn" id="btn_${uid}" onclick="distributeToken('${uid}', '${proj.sym}', ${user.amount}, '${proj.title}')">DISTRIBUTE</button>
            </div>
        `;
    });

    document.getElementById('projModal').style.display = 'flex';
}

// --- 4. Dynamic One-Click Distribution ---
async function distributeToken(uid, sym, amount, pTitle) {
    const btn = document.getElementById('btn_' + uid);
    if(btn.classList.contains('done')) return;

    btn.innerText = "Processing...";
    
    // ১. ইউজারের ব্যালেন্স রিড করা (ডায়নামিক পাথ: smat_balance, btc_balance ইত্যাদি)
    const userRef = db.ref(`users/${uid}`);
    const snap = await userRef.once('value');
    const uData = snap.val();
    
    const currentBal = parseFloat(uData[sym + '_balance'] || 0);
    const newBal = parseFloat((currentBal + amount).toFixed(8));

    const updates = {};
    // ডায়নামিক পাথ আপডেট
    updates[`users/${uid}/${sym}_balance`] = newBal;
    
    // ওয়ালেট হিস্টোরিতে "Funding In" পুশ করা
    const tid = "FUND_IN_" + Date.now();
    updates[`users/${uid}/history/${tid}`] = {
        method: 'Funding In',
        coin: sym.toUpperCase(),
        amount: amount.toFixed(2),
        timestamp: Date.now(),
        status: 'success',
        project: pTitle,
        hash: 'TXN-' + Math.random().toString(36).substr(2, 9).toUpperCase()
    };

    await db.ref().update(updates);
    
    btn.innerText = "SENT";
    btn.classList.add('done');
    showToast(`Token distributed to ${uData.smat_id}`);
}

function closeModal() { document.getElementById('projModal').style.display = 'none'; }

function clearForm() {
    document.getElementById('pTitle').value = "";
    document.getElementById('pSym').value = "";
    document.getElementById('pLogo').value = "";
}

function showToast(msg) {
    const box = document.getElementById('toast-box');
    const t = document.createElement('div');
    t.className = 'g-toast';
    t.innerText = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
