<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmatBit Admin | Venture Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #ffff00;
            --accent: #00ffff; --border: rgba(255, 255, 255, 0.1);
            --font-mon: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 700; }
        body { background: var(--bg); color: white; padding: 20px; }
        h1, h2, h3, .mon-900 { font-family: var(--font-mon); font-weight: 900; text-transform: uppercase; }

        .admin-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 15px; }
        .admin-header h1 { color: var(--primary); font-size: 24px; }

        /* Form Card */
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 30px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-box { margin-bottom: 15px; }
        .input-box label { display: block; font-size: 10px; color: var(--accent); margin-bottom: 5px; font-family: var(--font-mon); }
        input, textarea { width: 100%; background: #0b0e11; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; outline: none; }
        input:focus { border-color: var(--primary); }

        .btn-launch { width: 100%; background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 15px; font-size: 16px; cursor: pointer; font-family: var(--font-mon); margin-top: 10px; }

        /* Project History */
        .proj-item { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; border-left: 5px solid var(--accent); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; }
        .proj-item:hover { background: #252b32; }

        /* Distribution Modal (Full Graphic) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; z-index: 9999; padding: 20px; }
        .modal-content { background: var(--card); border: 1px solid var(--primary); border-radius: 25px; padding: 20px; max-width: 600px; margin: auto; width: 100%; max-height: 80vh; overflow-y: auto; }
        
        .user-row { background: rgba(255,255,255,0.03); margin-bottom: 8px; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; border: 1px solid var(--border); }
        .prop-badge { background: var(--accent); color: #000; padding: 2px 8px; border-radius: 5px; font-size: 10px; }

        /* Toast Notification */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10001; }
        .g-toast { background: var(--card); border-left: 4px solid var(--accent); padding: 15px 30px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); margin-bottom: 10px; animation: slideIn 0.4s forwards; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="admin-header">
        <h1>SmatBit Venture Admin</h1>
        <p style="font-size: 10px; color: var(--accent)">DYNAMIC PROJECT & DISTRIBUTION CONTROL</p>
    </div>

    <div class="card">
        <h3 class="mon-900" style="font-size: 14px; margin-bottom: 15px; color: var(--primary)">Upload New Venture</h3>
        <div class="grid-inputs">
            <div class="input-box"><label>Project Name</label><input type="text" id="pName" placeholder="e.g. SmatBit L1"></div>
            <div class="input-box"><label>Token Symbol (Small Letter Path)</label><input type="text" id="pSym" placeholder="smat"></div>
        </div>
        <div class="grid-inputs">
            <div class="input-box"><label>Total Token Amount</label><input type="number" id="pTotalTokens" placeholder="1000000"></div>
            <div class="input-box"><label>Vesting %</label><input type="number" id="pVesting" placeholder="10"></div>
        </div>
        <div class="grid-inputs">
            <div class="input-box"><label>Logo URL</label><input type="text" id="pLogo"></div>
            <div class="input-box"><label>Website URL</label><input type="text" id="pWeb"></div>
        </div>
        <div class="input-box"><label>Description</label><textarea id="pDesc" rows="3"></textarea></div>
        
        <div class="grid-inputs">
            <input type="text" id="pTwit" placeholder="Twitter URL">
            <input type="text" id="pTele" placeholder="Telegram URL">
        </div>
        <button class="btn-launch" onclick="launchProject()">LAUNCH & SAVE PROJECT</button>
    </div>

    <h3 class="mon-900" style="font-size: 14px; margin-bottom: 15px;">Project Repository (History)</h3>
    <div id="projectHistory"></div>

    <div class="modal-overlay" id="distModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="modalProjName" class="mon-900" style="color:var(--primary)"></h2>
                <i class="fas fa-times" onclick="closeModal()" style="cursor:pointer"></i>
            </div>
            
            <div id="distStats" style="background:#0b0e11; padding:15px; border-radius:15px; margin-bottom:20px; font-size:11px;">
                <p>Global Funding: <b id="statGlobal" style="color:var(--accent)">0</b> USDT</p>
                <p>Total Supply: <b id="statSupply" style="color:var(--primary)">0</b> Tokens</p>
            </div>

            <div id="userDistList"></div>
            
            <button class="btn-launch" id="distBtn" onclick="executeDistribution()">ONE-CLICK ALL DISTRIBUTION</button>
        </div>
    </div>

<script>
// Firebase Initialization
const firebaseConfig = { apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentProjects = [], selectedProj = null, contributors = [];

// --- 1. Launch Project ---
async function launchProject() {
    const data = {
        id: "PRJ" + Date.now(),
        title: document.getElementById('pName').value,
        sym: document.getElementById('pSym').value.toLowerCase(),
        total_tokens: parseFloat(document.getElementById('pTotalTokens').value),
        vesting_percent: document.getElementById('pVesting').value,
        logo: document.getElementById('pLogo').value,
        web_url: document.getElementById('pWeb').value,
        twitter_url: document.getElementById('pTwit').value,
        telegram_url: document.getElementById('pTele').value,
        description: document.getElementById('pDesc').value,
        timestamp: Date.now()
    };

    if(!data.title || !data.sym) return showToast("Project Name & Symbol Required!", "#f6465d");

    await db.ref('fundraising_history/' + data.id).set(data);
    await db.ref('active_fundraising').set(data); // ইউজার প্যানেলে সরাসরি আপডেট হবে
    
    showToast("Project Launched Successfully!");
}

// --- 2. Load Project History (Latest First) ---
db.ref('fundraising_history').on('value', snap => {
    const container = document.getElementById('projectHistory');
    container.innerHTML = "";
    const data = snap.val() || {};
    currentProjects = Object.keys(data).map(k => data[k]).sort((a,b) => b.timestamp - a.timestamp);

    currentProjects.forEach(p => {
        container.innerHTML += `
            <div class="proj-item" onclick="openDistModal('${p.id}')">
                <div>
                    <h4 class="mon-900" style="font-size:13px">${p.title}</h4>
                    <p style="font-size:10px; color:var(--accent)">Path: ${p.sym}_balance</p>
                </div>
                <i class="fas fa-users-cog" style="color:var(--primary)"></i>
            </div>
        `;
    });
});

// --- 3. Distribution Modal Logic ---
async function openDistModal(pId) {
    selectedProj = currentProjects.find(p => p.id === pId);
    document.getElementById('modalProjName').innerText = selectedProj.title;
    
    const snap = await db.ref('fundraising_contributions/' + pId).once('value');
    const rawCont = snap.val() || {};
    
    contributors = Object.keys(rawCont).map(uid => ({ uid, ...rawCont[uid] }));
    const globalTotal = contributors.reduce((sum, item) => sum + item.amount, 0);

    document.getElementById('statGlobal').innerText = globalTotal.toFixed(2);
    document.getElementById('statSupply').innerText = selectedProj.total_tokens;

    const listContainer = document.getElementById('userDistList');
    listContainer.innerHTML = "";

    contributors.forEach(user => {
        // প্রপোশনাল ক্যালকুলেশন: (ইউজারের ইনভেস্ট / মোট ইনভেস্ট) * মোট টোকেন
        const share = (user.amount / globalTotal) * selectedProj.total_tokens;
        user.calculatedShare = share;

        listContainer.innerHTML += `
            <div class="user-row">
                <div><b>${user.smat_id}</b><br><span style="color:var(--accent)">${user.amount} USDT</span></div>
                <div style="text-align:right">
                    <b style="color:var(--primary)">${share.toFixed(2)} ${selectedProj.sym.toUpperCase()}</b><br>
                    <span class="prop-badge">PROP. SHARE</span>
                </div>
            </div>
        `;
    });

    document.getElementById('distModal').style.display = 'flex';
}

// --- 4. Execute Distribution (One-Click) ---
async function executeDistribution() {
    const btn = document.getElementById('distBtn');
    btn.disabled = true;
    btn.innerText = "DISTRIBUTING...";

    const updates = {};
    const sym = selectedProj.sym;

    for (const user of contributors) {
        // ১. ইউজারের ব্যালেন্স রিড করা
        const userSnap = await db.ref(`users/${user.uid}/${sym}_balance`).once('value');
        const currentBal = parseFloat(userSnap.val() || 0);
        
        // ২. ব্যালেন্স আপডেট (ডায়নামিক পাথ)
        updates[`users/${user.uid}/${sym}_balance`] = parseFloat((currentBal + user.calculatedShare).toFixed(8));
        
        // ৩. হিস্টোরি পুশ (Funding In)
        const tid = "DIST_" + Date.now() + "_" + user.uid.substring(0,4);
        updates[`users/${user.uid}/history/${tid}`] = {
            method: 'Funding In',
            coin: sym.toUpperCase(),
            amount: user.calculatedShare.toFixed(2),
            timestamp: Date.now(),
            status: 'success',
            project: selectedProj.title
        };
    }

    try {
        await db.ref().update(updates);
        showToast("All Coins Distributed Successfully!");
        closeModal();
    } catch (e) {
        showToast("Error in distribution!", "#f6465d");
    }
}

function closeModal() { document.getElementById('distModal').style.display = 'none'; }

function showToast(msg, color = "#00ffff") {
    const container = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'g-toast';
    t.style.borderLeftColor = color;
    t.innerHTML = `<b class="mon-900" style="font-size:10px; color:${color}">NOTIFICATION</b><br>${msg}`;
    container.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
