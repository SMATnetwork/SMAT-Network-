<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SMAT | Venture Distribution</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgdmlld0JveD0iMCAwIDUxMiA1MTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CiAgPGNpcmNsZSBjeD0iMjU2IiBjeT0iMjU2IiByPSIyNDAiIGZpbGw9IiNmM2JhMmYiLz4KICA8Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjIxNSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSI4IiBmaWxsPSJ0cmFuc3BhcmVudCIvPgogIDxwYXRoIGQ9Ik0xNTAgMTcwIEMxNTAgMTQ1IDE3MCAxMzUgMjAwIDEzNSBMMzQwIDEzNSBDMzU1IDEzNSAzNjUgMTQ1IDM2NSAxNjAgQzM2NSAxNzUgMzU1IDE4NSAzNDAgMTg1IEwyMDUgMTg1IEMxOTAgMTg1IDE4NSAxOTAgMTg1IDIwNSBDMTg1IDIyMCAxOTAgMjI1IDIwNSAyMjUgTDM0MCAyMjUgQzM3MCAyMjUgMzkwIDI0NSAzOTAgMjc1IEwzOTAgMzI1IEMzOTAgMzU1IDM3MCAzNzUgMzQwIDM3NSBMMTcwIDM3NSBDMTU1IDM3NSAxNDUgMzY1IDE0NSAzNTAgQzE0NSAzMzUgMTU1IDMyNSAxNzAgMzI1IEwzMzUgMzI1IEMzNTAgMzI1IDM1NSAzMjAgMzU1IDMwNSBDMzU1IDI5MCAzNTAgMjg1IDMzNSAyODUgTDIwMCAyODUgQzE3MCAyODUgMTUwIDI2NSAxNTAgMjM1IFoiIGZpbGw9IndoaXRlIi8+Cjwvc3ZnPg==">  
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #ffff00;
            --accent: #00ffff; --border: rgba(255, 255, 255, 0.1);
            --font-mon: 'Montserrat', sans-serif;
            --status-ongoing: #0ecb81;
            --status-completed: #f6465d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 700; }
        body { background: var(--bg); color: white; padding: 20px; padding-bottom: 50px; }
        h1, h2, h3, .mon-900 { font-family: var(--font-mon); font-weight: 900; text-transform: uppercase; }

        .admin-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 15px; }
        .admin-header h1 { color: var(--primary); font-size: 24px; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 30px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-box { margin-bottom: 15px; }
        .input-box label { display: block; font-size: 10px; color: var(--accent); margin-bottom: 5px; font-family: var(--font-mon); }
        input, textarea, select { width: 100%; background: #0b0e11; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; outline: none; }
        input:focus { border-color: var(--primary); }

        .btn-launch { width: 100%; background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 15px; font-size: 16px; cursor: pointer; font-family: var(--font-mon); margin-top: 10px; transition: 0.3s; }
        .btn-launch:active { transform: scale(0.98); }
        .btn-delete { background: #f6465d !important; color: white !important; margin-top: 20px; font-size: 12px; padding: 12px; }

        .proj-item { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 12px; border-left: 5px solid var(--accent); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .status-tag { font-size: 9px; padding: 3px 8px; border-radius: 5px; margin-left: 10px; }
        .tag-ongoing { background: rgba(14, 203, 129, 0.1); color: var(--status-ongoing); }
        .tag-completed { background: rgba(246, 70, 93, 0.1); color: var(--status-completed); }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; z-index: 9999; padding: 20px; }
        .modal-content { background: var(--card); border: 1px solid var(--primary); border-radius: 25px; padding: 25px; max-width: 500px; margin: auto; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
        
        .vesting-control { background: #0b0e11; padding: 15px; border-radius: 15px; margin: 15px 0; border: 1px solid var(--accent); }
        .preview-box { background: rgba(255,255,255,0.02); border-radius: 10px; padding: 10px; margin-top: 10px; max-height: 150px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); }
        .user-preview-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 11px; }

        /* Graphic Toast */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10001; width: 90%; max-width: 400px; }
        .g-toast { background: #1c2127; border-left: 5px solid var(--accent); padding: 15px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 10px; animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; border: 1px solid rgba(255,255,255,0.05); }
        @keyframes toastIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="admin-header">
        <h1>SmatBit Venture Admin</h1>
        <p style="font-size: 10px; color: var(--accent)">DYNAMIC TOKEN DISTRIBUTION SYSTEM</p>
    </div>

    <div class="card">
        <h3 class="mon-900" style="font-size: 14px; margin-bottom: 15px; color: var(--primary)">Launch New Project</h3>
        <div class="grid-inputs">
            <div class="input-box"><label>Project Name</label><input type="text" id="pName" placeholder="e.g. SmatBit L1"></div>
            <div class="input-box"><label>Symbol (Token Path)</label><input type="text" id="pSym" placeholder="smat"></div>
        </div>
        <div class="grid-inputs">
            <div class="input-box"><label>Total Supply</label><input type="number" id="pTotalTokens" placeholder="2500000"></div>
            <div class="input-box"><label>Default Vesting %</label><input type="number" id="pVesting" placeholder="10"></div>
        </div>
        <div class="grid-inputs">
            <div class="input-box"><label>Logo URL</label><input type="text" id="pLogo"></div>
            <div class="input-box"><label>Website URL</label><input type="text" id="pWeb"></div>
        </div>
        <div class="grid-inputs">
            <div class="input-box"><label>Twitter</label><input type="text" id="pTwit"></div>
            <div class="input-box"><label>Telegram</label><input type="text" id="pTele"></div>
        </div>
        <div class="input-box"><label>Discord URL</label><input type="text" id="pDisc"></div>
        <div class="input-box"><label>Description</label><textarea id="pDesc" rows="3"></textarea></div>
        
        <button class="btn-launch" onclick="launchProject()">LAUNCH PROJECT</button>
    </div>

    <h3 class="mon-900" style="font-size: 14px; margin-bottom: 15px;">Active Project Management</h3>
    <div id="projectHistory"></div>

    <div class="modal-overlay" id="manageModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 id="modalTitle" class="mon-900" style="color:var(--primary)"></h2>
                <i class="fas fa-times" onclick="closeModal()" style="cursor:pointer; color:var(--status-completed)"></i>
            </div>
            
            <div class="input-box">
                <label>CHANGE STATUS</label>
                <select id="statusSelect" onchange="updateStatus()">
                    <option value="Ongoing">Ongoing</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <div class="vesting-control">
                <h4 class="mon-900" style="font-size:11px; color:var(--accent); margin-bottom:12px;">Manual Token Distribution</h4>
                <div class="input-box">
                    <label>PHASE NAME</label>
                    <input type="text" id="vestName" placeholder="e.g. TGE / Phase 1">
                </div>
                <div class="input-box">
                    <label>TOTAL TOKENS TO RELEASE</label>
                    <input type="number" id="distQty" placeholder="Amount to distribute" oninput="showPreview()">
                </div>

                <div class="preview-box" id="distPreview">
                    <p style="font-size:9px; color:gray; text-align:center;">Preview will appear here...</p>
                </div>

                <button class="btn-launch" id="distBtn" style="padding:12px; font-size:12px;" onclick="confirmDistribution()">DISTRIBUTE NOW</button>
            </div>

            <div id="logsBox">
                <h4 class="mon-900" style="font-size:10px; margin-bottom:10px;">Logs</h4>
                <div id="logsContainer" style="font-size:10px;"></div>
            </div>

            <button class="btn-launch btn-delete mon-900" onclick="hideProject()">DELETE FROM ADMIN PANEL</button>
        </div>
    </div>

<script>
const firebaseConfig = { apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allProjects = [], selectedProj = null;

// --- Project Launch ---
async function launchProject() {
    const id = "PRJ" + Date.now();
    const data = {
        id, title: document.getElementById('pName').value,
        sym: document.getElementById('pSym').value.toLowerCase(),
        total_tokens: parseFloat(document.getElementById('pTotalTokens').value),
        vesting_percent: document.getElementById('pVesting').value,
        logo: document.getElementById('pLogo').value,
        web_url: document.getElementById('pWeb').value,
        twitter_url: document.getElementById('pTwit').value,
        telegram_url: document.getElementById('pTele').value,
        discord_url: document.getElementById('pDisc').value,
        description: document.getElementById('pDesc').value,
        status: 'Ongoing', timestamp: Date.now(), admin_hidden: false
    };

    if(!data.title || !data.sym) return showToast("Title & Symbol are required!", "#f6465d");
    await db.ref('fundraising_history/' + id).set(data);
    showToast("Project Launched Successfully!");
}

// --- Sync History ---
db.ref('fundraising_history').on('value', snap => {
    const container = document.getElementById('projectHistory');
    container.innerHTML = "";
    const data = snap.val() || {};
    allProjects = Object.keys(data).map(k => ({id: k, ...data[k]})).sort((a,b) => b.timestamp - a.timestamp);

    allProjects.filter(p => !p.admin_hidden).forEach(p => {
        const sClass = p.status === 'Completed' ? 'tag-completed' : 'tag-ongoing';
        container.innerHTML += `
            <div class="proj-item" onclick="openManage('${p.id}')">
                <div>
                    <h4 class="mon-900" style="font-size:12px">${p.title} <span class="status-tag ${sClass}">${p.status}</span></h4>
                    <p style="font-size:9px; color:gray">Path: ${p.sym}_balance | Supply: ${p.total_tokens}</p>
                </div>
                <i class="fas fa-cog" style="color:var(--primary)"></i>
            </div>
        `;
    });
});

// --- Modal Control ---
async function openManage(id) {
    selectedProj = allProjects.find(x => x.id === id);
    document.getElementById('modalTitle').innerText = selectedProj.title;
    document.getElementById('statusSelect').value = selectedProj.status;
    document.getElementById('manageModal').style.display = 'flex';
    document.getElementById('distPreview').innerHTML = "";
    loadLogs(id);
}

function closeModal() { document.getElementById('manageModal').style.display = 'none'; }

// --- Status Update ---
async function updateStatus() {
    const s = document.getElementById('statusSelect').value;
    await db.ref(`fundraising_history/${selectedProj.id}/status`).set(s);
    showToast("Status Updated to " + s);
}

// --- Proportional Preview ---
async function showPreview() {
    const qty = parseFloat(document.getElementById('distQty').value);
    const box = document.getElementById('distPreview');
    if(!qty || qty <= 0) return box.innerHTML = "<p style='font-size:9px; color:gray; text-align:center;'>Enter amount...</p>";

    const snap = await db.ref(`fundraising_contributions/${selectedProj.id}`).once('value');
    const contributors = snap.val() || {};
    const uids = Object.keys(contributors);

    if(uids.length === 0) return box.innerHTML = "<p style='font-size:9px; color:orange; text-align:center;'>No contributors found.</p>";

    const totalFund = uids.reduce((acc, uid) => acc + contributors[uid].amount, 0);
    let html = "";
    uids.forEach(uid => {
        const share = (contributors[uid].amount / totalFund) * qty;
        html += `
            <div class="user-preview-row">
                <span>${contributors[uid].smat_id}</span>
                <span style="color:var(--accent)">+ ${share.toFixed(2)} ${selectedProj.sym.toUpperCase()}</span>
            </div>
        `;
    });
    box.innerHTML = html;
}

// --- Distribution ---
async function confirmDistribution() {
    const phase = document.getElementById('vestName').value.trim();
    const qty = parseFloat(document.getElementById('distQty').value);
    if(!phase || !qty) return showToast("Fill all distribution fields!", "#f6465d");

    const btn = document.getElementById('distBtn');
    btn.disabled = true; btn.innerText = "PROCESSING...";

    const snap = await db.ref(`fundraising_contributions/${selectedProj.id}`).once('value');
    const contributors = snap.val() || {};
    const uids = Object.keys(contributors);
    const totalFund = uids.reduce((acc, uid) => acc + contributors[uid].amount, 0);

    const updates = {};
    const sym = selectedProj.sym;

    for(const uid of uids) {
        const share = (contributors[uid].amount / totalFund) * qty;
        const balSnap = await db.ref(`users/${uid}/${sym}_balance`).once('value');
        const old = parseFloat(balSnap.val() || 0);
        
        updates[`users/${uid}/${sym}_balance`] = parseFloat((old + share).toFixed(8));
        updates[`users/${uid}/history/DIST_${Date.now()}_${uid.slice(0,3)}`] = {
            method: 'Venture In Fund', coin: sym.toUpperCase(), amount: share.toFixed(2),
            timestamp: Date.now(), status: 'success', note: phase
        };
    }

    updates[`fundraising_history/${selectedProj.id}/distributions/${phase}`] = {
        amount: qty, timestamp: Date.now()
    };

    await db.ref().update(updates);
    showToast(`${phase} distributed successfully!`);
    btn.disabled = false; btn.innerText = "DISTRIBUTE NOW";
    document.getElementById('vestName').value = "";
    document.getElementById('distQty').value = "";
    loadLogs(selectedProj.id);
}

// --- Logs & Delete ---
function loadLogs(id) {
    const box = document.getElementById('logsContainer');
    box.innerHTML = "";
    db.ref(`fundraising_history/${id}/distributions`).once('value', snap => {
        const logs = snap.val() || {};
        Object.keys(logs).forEach(k => {
            box.innerHTML += `<div style="padding:5px 0; border-bottom:1px solid #333;"><b>${k}</b>: ${logs[k].amount} Tokens <span style="color:var(--status-ongoing); float:right;">DONE</span></div>`;
        });
    });
}

async function hideProject() {
    // এখানে ব্রাউজার কনফার্মেশন এর বদলে আমরা সরাসরি অ্যাকশন নিচ্ছি গ্রাফিক টোস্ট দিয়ে
    await db.ref(`fundraising_history/${selectedProj.id}/admin_hidden`).set(true);
    showToast("Project hidden from Admin Panel", "#f6465d");
    closeModal();
}

// --- Graphic Toast Function ---
function showToast(msg, color = "#00ffff") {
    const container = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'g-toast';
    t.style.borderLeftColor = color;
    t.innerHTML = `<span class="mon-900" style="font-size:9px; color:${color}; display:block; margin-bottom:5px;">SYSTEM NOTIFICATION</span>
                   <span style="font-size:12px; color:white;">${msg}</span>`;
    container.appendChild(t);
    setTimeout(() => {
        t.style.opacity = "0";
        t.style.transform = "translateY(-20px)";
        setTimeout(() => t.remove(), 4000);
    }, 3000);
}
</script>
</body>
</html>
