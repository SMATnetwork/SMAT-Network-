<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmatBit | Launchpad</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #f0b90b;
            --up: #0ecb81; --down: #f6465d; --text-sec: #848e9c;
            --border: rgba(255, 255, 255, 0.08);
            --font-mont: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 700; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; padding-bottom: 100px; display: none; }

        .header { padding: 30px 20px; text-align: left; background: linear-gradient(180deg, rgba(240, 185, 11, 0.05) 0%, var(--bg) 100%); }
        .header h1 { font-family: var(--font-mont); color: var(--primary); font-size: 24px; text-transform: uppercase; }
        .header p { font-size: 11px; color: var(--text-sec); margin-top: 5px; font-weight: 400; }

        .container { padding: 0 15px; }

        /* Launchpad Item Row Style (Not Card) */
        .lp-item { border-bottom: 1px solid var(--border); padding: 20px 0; position: relative; }
        .lp-desc { font-size: 12px; color: var(--text-sec); font-weight: 400; margin-bottom: 15px; line-height: 1.5; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; border-left: 3px solid var(--primary); }
        
        .lp-main-row { display: flex; align-items: center; gap: 15px; }
        .lp-logo { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border); padding: 2px; background: #000; }
        
        .lp-info { flex: 1; }
        .lp-info h2 { font-size: 16px; font-family: var(--font-mont); display: flex; align-items: center; gap: 8px; }
        .lp-badge { font-size: 9px; background: var(--primary); color: #000; padding: 2px 6px; border-radius: 4px; }

        .lp-stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 9px; color: var(--text-sec); display: block; margin-bottom: 4px; }
        .stat-val { font-size: 11px; color: white; }

        .timer-box { margin-top: 10px; font-size: 11px; color: var(--up); display: flex; align-items: center; gap: 5px; }

        .btn-lock { background: var(--primary); color: #000; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 900; font-size: 12px; margin-top: 15px; width: 100%; cursor: pointer; }
        .btn-lock:disabled { background: #2b3139; color: var(--text-sec); cursor: not-allowed; }

        /* Popups */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 9000; padding: 25px; }
        .modal { background: var(--card); width: 100%; max-width: 380px; border-radius: 24px; padding: 25px; border: 1px solid var(--border); }
        
        .input-group { background: #0b0e11; border-radius: 15px; padding: 15px; margin: 15px 0; border: 1px solid var(--border); position: relative; }
        .input-group input { width: 70%; background: transparent; border: none; color: white; font-size: 18px; outline: none; }
        .max-tag { position: absolute; right: 15px; color: var(--primary); font-size: 11px; top: 50%; transform: translateY(-50%); }

        /* Nav */
        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: var(--bg); display: flex; border-top: 1px solid var(--border); z-index: 4000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--text-sec); font-size: 11px; gap: 4px; }
        .nav-item.active { color: var(--primary); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .live-dot { height: 6px; width: 6px; background: var(--up); border-radius: 50%; display: inline-block; animation: pulse 1s infinite; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Launchpad</h1>
        <p>Stake your assets to earn new tokens early.</p>
    </div>

    <div class="container" id="launchContainer">
        </div>

    <div class="overlay" id="lpOverlay"><div class="modal" id="lpModal"></div></div>

    <footer class="footer">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i>Wallet</a>
        <a href="launchpad.html" class="nav-item active"><i class="fas fa-rocket"></i>Launch</a>
        <a href="staking.html" class="nav-item"><i class="fas fa-layer-group"></i>Stake</a>
    </footer>

<script>
// --- FIREBASE SETUP ---
const firebaseConfig = { 
    apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
    authDomain: "smat-exchange.firebaseapp.com", 
    projectId: "smat-exchange", 
    databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userData = {}, launchpads = [];
const f8 = (n) => parseFloat(n || 0).toFixed(8);

auth.onAuthStateChanged(user => {
    if (user) { document.body.style.display = "block"; syncData(user.uid); }
    else { window.location.href = "logIn.html"; }
});

function syncData(uid) {
    // Admin uploads launchpad to 'launchpad_list'
    db.ref('launchpad_list').on('value', snap => {
        const val = snap.val() || {};
        // Sort by timestamp descending (newest first)
        launchpads = Object.keys(val).map(k => ({id: k, ...val[k]})).sort((a,b) => b.startTime - a.startTime);
        renderLaunchpad();
    });
    db.ref('users/' + uid).on('value', snap => {
        userData = snap.val() || {};
        renderLaunchpad();
    });
}

function renderLaunchpad() {
    const area = document.getElementById('launchContainer');
    let html = "";

    launchpads.forEach(lp => {
        const userLock = (userData.launch_locks && userData.launch_locks[lp.id]) ? userData.launch_locks[lp.id].amount : 0;
        const now = Date.now();
        const isEnded = now > lp.endTime;
        const isStarted = now > lp.startTime;

        html += `
            <div class="lp-item">
                <div class="lp-desc">${lp.description}</div>
                <div class="lp-main-row">
                    <img src="${lp.logoPath}" class="lp-logo">
                    <div class="lp-info">
                        <h2>${lp.tokenName} <span class="lp-badge">${lp.tokenSymbol}</span></h2>
                        <div class="timer-box">
                            <span class="live-dot" style="background:${isEnded?'#555':''}"></span>
                            ${isEnded ? 'Subscription Ended' : (isStarted ? 'Ends in: '+calcTime(lp.endTime) : 'Starts in: '+calcTime(lp.startTime))}
                        </div>
                    </div>
                </div>

                <div class="lp-stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Launchpad Pool</span>
                        <span class="stat-val">${lp.poolSize} ${lp.tokenSymbol}</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">My Locked (${lp.lockToken})</span>
                        <span class="stat-val">${f8(userLock)}</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Global Locked</span>
                        <span class="stat-val">${f8(lp.globalLocked)}</span>
                    </div>
                </div>

                <button class="btn-lock" ${isEnded?'disabled':''} onclick="openLockPop('${lp.id}')">
                    ${isEnded ? 'CLOSED' : 'LOCK '+lp.lockToken+' TO EARN'}
                </button>
            </div>
        `;
    });
    area.innerHTML = html || "<p style='text-align:center; padding-top:50px;'>No Active Launchpad.</p>";
}

function calcTime(target) {
    const diff = target - Date.now();
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    return `${days}d ${hours}h`;
}

// --- LOCK POPUP ---
function openLockPop(id) {
    const lp = launchpads.find(x => x.id === id);
    const balance = userData[lp.lockToken.toLowerCase() + '_balance'] || 0;
    const content = document.getElementById('lpModal');

    content.innerHTML = `
        <h2 style="font-family:var(--font-mont); text-align:center">Lock ${lp.lockToken}</h2>
        <p style="font-size:11px; text-align:center; color:var(--text-sec); margin-top:5px">Available: ${f8(balance)} ${lp.lockToken}</p>
        
        <div class="input-group">
            <input type="number" id="lockAmt" placeholder="0.00">
            <span class="max-tag" onclick="document.getElementById('lockAmt').value='${balance}'">MAX</span>
        </div>

        <div style="font-size:11px; color:var(--text-sec); line-height:1.6; margin-bottom:20px">
            * Your assets will be locked until the launchpad ends.<br>
            * Rewards are distributed every 24 hours based on your share.
        </div>

        <button class="btn-lock" onclick="executeLock('${id}')">CONFIRM LOCK</button>
        <button class="btn-cancel" onclick="closePop()">Cancel</button>
    `;
    document.getElementById('lpOverlay').style.display = 'flex';
}

async function executeLock(id) {
    const lp = launchpads.find(x => x.id === id);
    const amt = parseFloat(document.getElementById('lockAmt').value);
    const sym = lp.lockToken.toLowerCase();
    const balance = userData[sym + '_balance'] || 0;

    if(!amt || amt <= 0 || amt > balance) return alert("Invalid amount!");

    const tid = "LP_LOCK_" + Date.now();
    const up = {};
    // 1. Deduct from wallet
    up[`users/${auth.currentUser.uid}/${sym}_balance`] = parseFloat((balance - amt).toFixed(8));
    // 2. Add to locked data
    const currentLocked = (userData.launch_locks && userData.launch_locks[id]) ? userData.launch_locks[id].amount : 0;
    up[`users/${auth.currentUser.uid}/launch_locks/${id}`] = {
        amount: parseFloat((currentLocked + amt).toFixed(8)),
        lockToken: lp.lockToken,
        rewardToken: lp.tokenSymbol,
        unlockTime: lp.endTime,
        startTime: Date.now()
    };
    // 3. Update Global Locked for this LP
    up[`launchpad_list/${id}/globalLocked`] = (lp.globalLocked || 0) + amt;
    // 4. Push History
    up[`users/${auth.currentUser.uid}/history/${tid}`] = {
        method: 'Launchpad Locked',
        coin: lp.lockToken,
        amount: f8(amt),
        timestamp: Date.now(),
        status: 'success'
    };

    await db.ref().update(up);
    alert("Locked Successfully!");
    closePop();
}

function closePop() { document.getElementById('lpOverlay').style.display = 'none'; }
</script>
</body>
</html>
