<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmatBit | Venture Partnership</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #ffff00;
            --accent: #00ffff; --text-sec: #848e9c; --border: rgba(255, 255, 255, 0.08);
            --font-mon: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; font-weight: 700; padding-bottom: 100px; }
        
        .mon-900 { font-family: var(--font-mon); font-weight: 900; text-transform: uppercase; }

        /* Header */
        .v-header { padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .v-header h1 { font-size: 22px; color: var(--primary); margin-bottom: 8px; }
        .v-header h3 { font-size: 11px; color: var(--text-sec); letter-spacing: 0.5px; }

        /* Main List Container */
        #projectListContainer { padding: 15px; max-width: 600px; margin: auto; }

        /* Project Card */
        .proj-card { 
            background: var(--card); border-radius: 24px; padding: 20px; 
            border: 1px solid var(--border); margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .proj-top { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .proj-logo { width: 60px; height: 60px; border-radius: 15px; border: 2px solid var(--accent); object-fit: cover; }
        
        /* Description: Auto-adjust and word wrap */
        .description { 
            font-size: 13px; color: #b7bdc6; line-height: 1.6; 
            margin: 20px 0; text-align: justify; font-weight: 400;
            white-space: pre-wrap; 
            overflow-wrap: break-word; 
            word-wrap: break-word;
        }

        /* Links Grid */
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .link-item { 
            background: #0b0e11; padding: 12px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--border); text-decoration: none; color: white; 
        }
        .link-item i { color: var(--accent); }

        /* Funding Stats */
        .stats-card { 
            background: #161a1e; border-radius: 18px; padding: 15px; 
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; 
            text-align: center; border: 1px solid var(--accent); margin-bottom: 15px;
        }
        .stat-box span { font-size: 8px; color: var(--text-sec); display: block; }
        .stat-box b { font-size: 11px; color: white; }

        /* Buttons */
        .btn-participate { 
            width: 100%; background: var(--primary); color: #000; border: none; 
            padding: 16px; border-radius: 12px; font-size: 15px; cursor: pointer; 
        }

        /* History Table */
        .history-box { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 10px; color: var(--text-sec); padding: 8px; }
        td { padding: 10px 8px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .my-row { background: rgba(0, 255, 255, 0.05); color: var(--accent); }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal-content { background: var(--card); border: 1px solid var(--accent); border-radius: 24px; padding: 25px; width: 100%; max-width: 380px; text-align: center; }
        .f-input { width: 100%; background: #0b0e11; border: 1px solid var(--border); padding: 15px; border-radius: 10px; color: white; font-size: 18px; margin: 15px 0; outline: none; }

        /* Footer */
        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0b0e11; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); }
        .f-nav { text-decoration: none; color: var(--text-sec); text-align: center; font-size: 10px; flex: 1; }
        .f-nav i { font-size: 20px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="v-header">
        <h1 class="mon-900">SMAT Venture Partnership</h1>
        <h3 class="mon-900">Unity is strength, and strength is the force of the project</h3>
    </div>

    <div id="projectListContainer"></div>

    <div class="modal-overlay" id="fundModal">
        <div class="modal-content">
            <h2 class="mon-900" style="color:var(--accent)">Participate</h2>
            <p id="userBalDisplay" style="font-size:12px; margin-top:10px; color:var(--text-sec)"></p>
            <input type="number" id="investAmt" class="f-input" placeholder="0.00">
            <button class="btn-participate mon-900" onclick="confirmInvestment()">Confirm</button>
            <button onclick="closeModal()" style="background:none; border:none; color:white; margin-top:15px; cursor:pointer">Close</button>
        </div>
    </div>

    <footer class="footer">
        <a href="home.html" class="f-nav"><i class="fas fa-home"></i>Home</a>
        <a href="market.html" class="f-nav"><i class="fas fa-chart-line"></i>Market</a>
        <a href="wallet.html" class="f-nav"><i class="fas fa-wallet"></i>Wallet</a>
    </footer>

<script>
const firebaseConfig = { apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userData = {}, allProjects = [], activeInvestProj = null;

auth.onAuthStateChanged(user => {
    if (user) {
        db.ref('users/' + user.uid).on('value', snap => {
            userData = snap.val() || {};
            userData.uid = user.uid;
        });
        loadProjects();
    } else {
        window.location.href = "logIn.html";
    }
});

function loadProjects() {
    db.ref('fundraising_history').on('value', snap => {
        const data = snap.val() || {};
        allProjects = Object.keys(data).map(k => data[k]).sort((a,b) => b.timestamp - a.timestamp);
        renderUI();
    });
}

async function renderUI() {
    const container = document.getElementById('projectListContainer');
    container.innerHTML = "";

    if(allProjects.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:gray; margin-top:50px;'>No Available Project</p>";
        return;
    }

    for (let proj of allProjects) {
        const contSnap = await db.ref('fundraising_contributions/' + proj.id).once('value');
        const contributions = contSnap.val() || {};
        
        const historyArr = Object.keys(contributions).map(uid => ({uid, ...contributions[uid]})).sort((a,b) => b.amount - a.amount);
        const globalTotal = historyArr.reduce((acc, cur) => acc + cur.amount, 0);
        const myCont = historyArr.find(x => x.uid === userData.uid);
        const myTotal = myCont ? myCont.amount : 0;

        let visibleRows = "";
        let hiddenRows = "";
        
        historyArr.forEach((item, index) => {
            const isMe = item.uid === userData.uid;
            const row = `<tr class="${isMe ? 'my-row' : ''}"><td>${item.smat_id || 'User'}</td><td>${item.amount.toFixed(2)} USDT</td><td>#${index + 1}</td></tr>`;
            if (index < 5) visibleRows += row;
            else hiddenRows += row;
        });

        const card = `
            <div class="proj-card">
                <div class="proj-top">
                    <img src="${proj.logo}" class="proj-logo">
                    <h2 class="mon-900" style="color:var(--accent); font-size:18px;">${proj.title}</h2>
                </div>

                <div class="links-grid">
                    <a href="${proj.web_url}" target="_blank" class="link-item"><span>Website</span><i class="fas fa-globe"></i></a>
                    <a href="${proj.telegram_url}" target="_blank" class="link-item"><span>Telegram</span><i class="fab fa-telegram"></i></a>
                    <a href="${proj.twitter_url}" target="_blank" class="link-item"><span>Twitter</span><i class="fab fa-twitter"></i></a>
                    <a href="${proj.discord_url || '#'}" target="_blank" class="link-item"><span>Discord</span><i class="fab fa-discord"></i></a>
                </div>

                <div class="mon-900" style="color:var(--primary); font-size:12px; margin-bottom:10px;">Tokenomics</div>
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px;"><span>Total Tokens:</span><b>${proj.total_tokens}</b></div>
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:15px;"><span>Vesting:</span><b>${proj.vesting_percent}%</b></div>

                <div class="description">${proj.description}</div>

                <button class="btn-participate mon-900" onclick="openModal('${proj.id}')">Participate Now</button>

                <div class="stats-card" style="margin-top:20px;">
                    <div class="stat-box"><span>MY FUNDING</span><b>${myTotal.toFixed(2)}</b></div>
                    <div class="stat-box"><b style="color:var(--accent); font-size:8px;">SMAT VENTURE<br>GROWING</b></div>
                    <div class="stat-box"><span>GLOBAL FUNDING</span><b>${globalTotal.toFixed(2)}</b></div>
                </div>

                <div class="history-box">
                    <span class="mon-900" style="font-size:10px; color:var(--text-sec)">Funding History</span>
                    <table>
                        <thead><tr><th>SMAT ID</th><th>AMOUNT</th><th>RANK</th></tr></thead>
                        <tbody>${visibleRows || '<tr><td colspan="3" style="text-align:center">No contributions yet</td></tr>'}</tbody>
                        <tbody id="more-${proj.id}" style="display:none">${hiddenRows}</tbody>
                    </table>
                    ${hiddenRows ? `<div style="text-align:center; margin-top:10px;"><button onclick="toggleHistory('${proj.id}', this)" style="background:none; border:none; color:var(--accent); font-size:10px; cursor:pointer;" class="mon-900">+ Show More</button></div>` : ''}
                </div>
            </div>
        `;
        container.innerHTML += card;
    }
}

window.toggleHistory = (projId, btn) => {
    const moreList = document.getElementById(`more-${projId}`);
    if (moreList.style.display === "none") {
        moreList.style.display = "table-row-group";
        btn.innerText = "- Show Less";
    } else {
        moreList.style.display = "none";
        btn.innerText = "+ Show More";
    }
};

function openModal(id) {
    activeInvestProj = allProjects.find(p => p.id === id);
    document.getElementById('userBalDisplay').innerText = "Available: " + (userData.usdt_balance || 0).toFixed(2) + " USDT";
    document.getElementById('fundModal').style.display = 'flex';
}

function closeModal() { document.getElementById('fundModal').style.display = 'none'; }

async function confirmInvestment() {
    const amt = parseFloat(document.getElementById('investAmt').value);
    const myBal = parseFloat(userData.usdt_balance || 0);
    if(!amt || amt <= 0 || amt > myBal) return alert("Invalid Balance or Amount!");

    const pid = activeInvestProj.id;
    db.ref(`fundraising_contributions/${pid}/${userData.uid}`).once('value', s => {
        const prev = s.val() ? s.val().amount : 0;
        const updates = {};
        updates[`users/${userData.uid}/usdt_balance`] = parseFloat((myBal - amt).toFixed(8));
        updates[`fundraising_contributions/${pid}/${userData.uid}`] = {
            amount: prev + amt,
            smat_id: userData.smatID || "User",
            timestamp: Date.now()
        };
        const tid = "VENTURE_" + Date.now();
        updates[`users/${userData.uid}/history/${tid}`] = {
            method: 'Venture Invest', coin: 'USDT', amount: amt.toFixed(2), timestamp: Date.now(), status: 'success'
        };

        db.ref().update(updates).then(() => {
            alert("Success!");
            closeModal();
        });
    });
}
</script>
</body>
</html>
