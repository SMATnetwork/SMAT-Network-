<html lang="en">

    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #ffff00;
            --accent: #00ffff; --text-sec: #848e9c; --border: rgba(255, 255, 255, 0.08);
            --font-mont: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 700; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; padding-bottom: 100px; display: none; }

        /* Empty State */
        #emptyState { display: none; text-align: center; padding: 100px 20px; }
        #emptyState i { font-size: 60px; color: var(--border); margin-bottom: 20px; }

        /* Main Content */
        #mainContent { display: none; }
        .project-header { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, rgba(0, 255, 255, 0.05) 0%, var(--bg) 100%); }
        .project-logo { width: 85px; height: 85px; border-radius: 20px; border: 2px solid var(--accent); box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); object-fit: cover; }
        .project-title { font-family: var(--font-mont); font-size: 24px; color: var(--accent); text-transform: uppercase; margin-top: 15px; }

        .token-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .detail-box { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
        .detail-box span { color: var(--text-sec); display: block; font-size: 9px; text-transform: uppercase; margin-bottom: 4px; }
        .detail-box b { font-size: 11px; color: white; }

        /* Glowing Funding Card */
        .funding-card { margin: 15px; background: #161a1e; border-radius: 24px; padding: 25px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .venture-text { font-family: var(--font-mont); font-size: 10px; color: var(--accent); animation: glow 1.5s infinite alternate; text-align: center; }
        @keyframes glow { from { text-shadow: 0 0 5px var(--accent); opacity: 0.5; } to { text-shadow: 0 0 20px var(--accent); opacity: 1; } }

        /* Modal / Graphic Popup */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-card { background: var(--card); border: 1px solid var(--accent); border-radius: 25px; padding: 30px; width: 100%; max-width: 400px; text-align: center; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-card h2 { font-family: var(--font-mont); font-size: 18px; margin-bottom: 10px; color: var(--accent); }
        .avail-bal { font-size: 12px; color: var(--text-sec); margin-bottom: 20px; }
        .avail-bal b { color: var(--primary); }

        .input-wrap { background: #0b0e11; border-radius: 15px; padding: 15px; display: flex; align-items: center; border: 1px solid var(--border); margin-bottom: 20px; }
        .input-wrap input { background: transparent; border: none; color: white; flex: 1; font-size: 20px; outline: none; font-weight: 900; }
        .max-btn { color: var(--accent); font-size: 12px; cursor: pointer; padding: 5px 10px; border: 1px solid var(--accent); border-radius: 6px; }

        .btn-confirm { width: 100%; background: var(--accent); color: #000; border: none; padding: 16px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-close { color: var(--text-sec); background: none; border: none; margin-top: 15px; cursor: pointer; font-size: 12px; }

        /* Leaderboard */
        .leaderboard { padding: 15px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 15px 10px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border); }
        .my-row { background: rgba(0, 255, 255, 0.1); color: var(--accent); }

        /* Toast Notification */
        #toast-box { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10000; }
        .g-toast { background: var(--card); border-left: 4px solid var(--accent); padding: 15px 25px; border-radius: 12px; color: white; font-size: 13px; margin-bottom: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: popIn 0.3s; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-box"></div>

    <div class="modal-overlay" id="fundModal">
        <div class="modal-card">
            <h2>CONTRIBUTE FUND</h2>
            <div class="avail-bal">Available: <b id="modalAvail">0.00</b> USDT</div>
            <div class="input-wrap">
                <input type="number" id="modalInput" placeholder="0.00">
                <span class="max-btn" onclick="setMax()">MAX</span>
            </div>
            <button class="btn-confirm" onclick="executeContribution()">CONFIRM FUNDING</button>
            <button class="btn-close" onclick="closeModal()">CANCEL</button>
        </div>
    </div>

    <div id="emptyState">
        <i class="fas fa-rocket"></i>
        <p style="color: var(--text-sec); margin-top: 15px;">No active projects. Check back soon!</p>
    </div>

    <div id="mainContent">
        <div class="project-header">
            <img src="" class="project-logo" id="projLogo">
            <h1 class="project-title" id="projTitle"></h1>
        </div>

        <div class="token-details" id="projDetails">
            <div class="detail-box"><span>Token</span><b id="tName">-</b></div>
            <div class="detail-box"><span>Supply</span><b id="tSupply">-</b></div>
            <div class="detail-box"><span>Vesting</span><b id="tVesting">-</b></div>
            <div class="detail-box"><span>Network</span><b>BEP-20</b></div>
        </div>

        <div class="funding-card">
            <div style="text-align:center"><span style="font-size:9px; color:var(--text-sec)">MY FUND</span><br><b id="myFund">0.00</b></div>
            <div class="venture-text">SMAT<br>VENTURE</div>
            <div style="text-align:center"><span style="font-size:9px; color:var(--text-sec)">TOTAL FUND</span><br><b id="totalFund">0.00</b></div>
        </div>

        <div style="padding: 15px;">
            <button class="btn-confirm" style="background:var(--primary)" onclick="openFundModal()">SUBMIT FUNDING</button>
        </div>

        <div class="leaderboard">
            <h3 style="font-size:12px; margin-bottom:10px; color:var(--text-sec)">CONTRIBUTORS RANK</h3>
            <table><tbody id="leaderTable"></tbody></table>
            <div id="moreBtn" style="text-align:center; padding:15px; color:var(--accent); display:none" onclick="loadMore()">Show More</div>
        </div>
    </div>

<script>
// --- FIREBASE CONFIG ---
const firebaseConfig = { 
    apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
    authDomain: "smat-exchange.firebaseapp.com", 
    projectId: "smat-exchange", 
    databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userData = {}, activeProject = null, allContributors = [], displayLimit = 50;

auth.onAuthStateChanged(user => {
    if (user) { document.body.style.display = "block"; loadUser(user.uid); loadProject(); }
    else { window.location.href = "logIn.html"; }
});

function loadUser(uid) {
    db.ref('users/' + uid).on('value', snap => {
        userData = snap.val() || {};
        userData.uid = uid;
    });
}

function loadProject() {
    db.ref('active_fundraising').on('value', snap => {
        activeProject = snap.val();
        if(!activeProject || !activeProject.id) {
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
            return;
        }
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('projTitle').innerText = activeProject.title;
        document.getElementById('projLogo').src = activeProject.logo;
        document.getElementById('tName').innerText = activeProject.tokenSymbol;
        document.getElementById('tSupply').innerText = activeProject.supply;
        document.getElementById('tVesting').innerText = activeProject.vesting;
        
        loadContributors();
    });
}

function loadContributors() {
    db.ref('fundraising_contributions/' + activeProject.id).on('value', snap => {
        const val = snap.val() || {};
        allContributors = Object.keys(val).map(k => ({uid: k, ...val[k]})).sort((a,b) => b.amount - a.amount);
        let total = allContributors.reduce((s, i) => s + i.amount, 0);
        document.getElementById('totalFund').innerText = total.toFixed(2) + " USDT";
        const my = allContributors.find(x => x.uid === userData.uid);
        document.getElementById('myFund').innerText = (my ? my.amount : 0).toFixed(2) + " USDT";
        renderLeaderboard();
    });
}

function renderLeaderboard() {
    const table = document.getElementById('leaderTable');
    table.innerHTML = "";
    const myData = allContributors.find(x => x.uid === userData.uid);
    if(myData) table.innerHTML += `<tr class="my-row"><td>${userData.smat_id || 'Me'}</td><td>${myData.amount.toFixed(2)} USDT</td></tr>`;
    allContributors.slice(0, displayLimit).forEach(item => {
        if(item.uid === userData.uid) return;
        table.innerHTML += `<tr><td>${item.smat_id}</td><td>${item.amount.toFixed(2)} USDT</td></tr>`;
    });
}

// --- POPUP LOGIC ---
function openFundModal() {
    document.getElementById('modalAvail').innerText = parseFloat(userData.usdt_balance || 0).toFixed(2);
    document.getElementById('fundModal').style.display = 'flex';
}

function closeModal() { document.getElementById('fundModal').style.display = 'none'; }

function setMax() {
    document.getElementById('modalInput').value = parseFloat(userData.usdt_balance || 0);
}

async function executeContribution() {
    const amt = parseFloat(document.getElementById('modalInput').value);
    const balance = parseFloat(userData.usdt_balance || 0);

    if(!amt || amt <= 0 || amt > balance) return showToast("Invalid amount or balance!", "#ff0000");

    const up = {};
    const pid = activeProject.id;
    up[`users/${userData.uid}/usdt_balance`] = parseFloat((balance - amt).toFixed(8));
    
    let cur = 0;
    const exist = allContributors.find(x => x.uid === userData.uid);
    if(exist) cur = exist.amount;

    up[`fundraising_contributions/${pid}/${userData.uid}`] = {
        amount: cur + amt,
        smat_id: userData.smat_id || "User",
        timestamp: Date.now()
    };

    const tid = "FUND_OUT_" + Date.now();
    up[`users/${userData.uid}/history/${tid}`] = {
        method: 'Funding Out', coin: 'USDT', amount: amt.toFixed(2), timestamp: Date.now(), status: 'success'
    };

    try {
        await db.ref().update(up);
        showToast("Funding Contribution Success!");
        closeModal();
        document.getElementById('modalInput').value = "";
    } catch(e) { showToast("Transaction Failed!", "#ff0000"); }
}

function showToast(msg, color = "#00ffff") {
    const box = document.getElementById('toast-box');
    const t = document.createElement('div');
    t.className = 'g-toast';
    t.style.borderLeftColor = color;
    t.innerHTML = `<i class="fas fa-check-circle" style="color:${color}"></i> <span>${msg}</span>`;
    box.appendChild(t);
    setTimeout(() => { t.remove(); }, 3000);
}
</script>
</body>
</html>
