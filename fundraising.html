<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgdmlld0JveD0iMCAwIDUxMiA1MTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CiAgPGNpcmNsZSBjeD0iMjU2IiBjeT0iMjU2IiByPSIyNDAiIGZpbGw9IiNmM2JhMmYiLz4KICA8Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjIxNSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSI4IiBmaWxsPSJ0cmFuc3BhcmVudCIvPgogIDxwYXRoIGQ9Ik0xNTAgMTcwIEMxNTAgMTQ1IDE3MCAxMzUgMjAwIDEzNSBMMzQwIDEzNSBDMzU1IDEzNSAzNjUgMTQ1IDM2NSAxNjAgQzM2NSAxNzUgMzU1IDE4NSAzNDAgMTg1IEwyMDUgMTg1IEMxOTAgMTg1IDE4NSAxOTAgMTg1IDIwNSBDMTg1IDIyMCAxOTAgMjI1IDIwNSAyMjUgTDM0MCAyMjUgQzM3MCAyMjUgMzkwIDI0NSAzOTAgMjc1IEwzOTAgMzI1IEMzOTAgMzU1IDM3MCAzNzUgMzQwIDM3NSBMMTcwIDM3NSBDMTU1IDM3NSAxNDUgMzY1IDE0NSAzNTAgQzE0NSAzMzUgMTU1IDMyNSAxNzAgMzI1IEwzMzUgMzI1IEMzNTAgMzI1IDM1NSAzMjAgMzU1IDMwNSBDMzU1IDI5MCAzNTAgMjg1IDMzNSAyODUgTDIwMCAyODUgQzE3MCAyODUgMTUwIDI2NSAxNTAgMjM1IFoiIGZpbGw9IndoaXRlIi8+Cjwvc3ZnPg==">    
    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #ffff00;
            --accent: #00ffff; --text-sec: #848e9c; --border: rgba(255, 255, 255, 0.08);
            --font-mon: 'Montserrat', sans-serif;
            --status-ongoing: #0ecb81;
            --status-completed: #f6465d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; font-weight: 700; padding-bottom: 100px; }
        
        .mon-900 { font-family: var(--font-mon); font-weight: 900; text-transform: uppercase; }

        .v-header { padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .v-header h1 { font-size: 20px; color: var(--primary); margin-bottom: 8px; }
        .v-header h3 { font-size: 10px; color: var(--text-sec); letter-spacing: 0.5px; }

        #projectListContainer { padding: 15px; max-width: 600px; margin: auto; }

        .proj-card { 
            position: relative; background: var(--card); border-radius: 24px; padding: 20px; 
            border: 1px solid var(--border); margin-bottom: 25px; overflow: hidden;
        }

        .status-badge {
            position: absolute; top: 20px; right: 20px; padding: 5px 12px; 
            border-radius: 8px; font-size: 9px; font-family: var(--font-mon);
        }
        .ongoing { color: var(--status-ongoing); background: rgba(14, 203, 129, 0.1); border: 1px solid var(--status-ongoing); }
        .completed { color: var(--status-completed); background: rgba(246, 70, 93, 0.1); border: 1px solid var(--status-completed); }

        .proj-top { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-right: 80px; }
        .proj-logo { width: 55px; height: 55px; border-radius: 15px; border: 2px solid var(--accent); object-fit: cover; }
        
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .link-item { 
            background: #0b0e11; padding: 12px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--border); text-decoration: none; color: white; font-size: 12px;
        }
        .link-item i { color: var(--accent); }

        .description-box { 
            font-size: 13px; color: #b7bdc6; line-height: 1.6; 
            margin: 15px 0; text-align: justify; font-weight: 400;
            white-space: pre-wrap; word-wrap: break-word;
            padding: 10px 0; border-top: 1px solid var(--border);
        }

        .tokenomics-box { margin-bottom: 15px; }
        .token-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }

        .btn-participate { 
            width: 100%; background: var(--primary); color: #000; border: none; 
            padding: 16px; border-radius: 12px; font-size: 15px; cursor: pointer; 
        }
        .btn-participate:disabled { background: #474d57; color: #848e9c; cursor: not-allowed; }

        .stats-card { 
            background: #161a1e; border-radius: 18px; padding: 15px; 
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; 
            text-align: center; border: 1px solid var(--accent); margin-top: 20px;
        }
        .stat-box span { font-size: 8px; color: var(--text-sec); display: block; }
        .stat-box b { font-size: 11px; color: white; }

        .history-box { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 10px; color: var(--text-sec); padding: 8px; }
        td { padding: 10px 8px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .my-row { background: rgba(0, 255, 255, 0.05); color: var(--accent); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal-content { background: var(--card); border: 1px solid var(--accent); border-radius: 24px; padding: 25px; width: 100%; max-width: 380px; text-align: center; }
        .f-input { width: 100%; background: #0b0e11; border: 1px solid var(--border); padding: 15px; border-radius: 10px; color: white; font-size: 18px; margin: 15px 0; outline: none; }
        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: #0b0e11; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000; }
        .f-nav { text-decoration: none; color: var(--text-sec); text-align: center; font-size: 10px; flex: 1; }
        .f-nav i { font-size: 20px; display: block; margin-bottom: 5px; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10001; width: 90%; max-width: 400px; }
        .g-toast { background: #1c2127; border-left: 5px solid var(--accent); padding: 15px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 10px; animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; border: 1px solid rgba(255,255,255,0.05); }
        @keyframes toastIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="v-header">
        <h1 class="mon-900">SMAT Venture Partnership</h1>
        <h3 class="mon-900">Unity is strength, and strength is the force of the project</h3>
    </div>

    <div id="projectListContainer"></div>

    <div class="modal-overlay" id="fundModal">
        <div class="modal-content">
            <h2 class="mon-900" style="color:var(--accent)">Participate</h2>
            <p id="userBalDisplay" style="font-size:12px; margin-top:10px; color:var(--text-sec)"></p>
            <input type="number" id="investAmt" class="f-input" placeholder="0.00">
            <button id="confirmBtn" class="btn-participate mon-900" onclick="confirmInvestment()">Confirm</button>
            <button onclick="closeModal()" style="background:none; border:none; color:white; margin-top:15px; cursor:pointer">Close</button>
        </div>
    </div>

    <footer class="footer">
        <a href="home.html" class="f-nav"><i class="fas fa-home"></i>Home</a>
        <a href="market.html" class="f-nav"><i class="fas fa-chart-line"></i>Market</a>
        <a href="wallet.html" class="f-nav"><i class="fas fa-wallet"></i>Wallet</a>
    </footer>

<script>
const firebaseConfig = { apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userData = {}, allProjects = [], activeInvestProj = null;

auth.onAuthStateChanged(user => {
    if (user) {
        db.ref('users/' + user.uid).on('value', snap => {
            userData = snap.val() || {};
            userData.uid = user.uid;
            if(document.getElementById('fundModal').style.display === 'flex') {
                document.getElementById('userBalDisplay').innerText = "Balance: " + (userData.usdt_balance || 0).toFixed(2) + " USDT";
            }
            renderUI();
        });
        loadProjects();
    } else {
        window.location.href = "logIn.html";
    }
});

function loadProjects() {
    db.ref('fundraising_history').on('value', snap => {
        const data = snap.val() || {};
        allProjects = Object.keys(data).map(k => ({id: k, ...data[k]})).sort((a,b) => b.timestamp - a.timestamp);
        renderUI();
    });
}

async function renderUI() {
    const container = document.getElementById('projectListContainer');
    if (!container) return;
    
    let htmlContent = ""; // পুরো HTML আগে এখানে জমা হবে

    for (let proj of allProjects) {
        const contSnap = await db.ref('fundraising_contributions/' + proj.id).once('value');
        const contributions = contSnap.val() || {};
        const historyArr = Object.keys(contributions).map(uid => ({uid, ...contributions[uid]})).sort((a,b) => b.amount - a.amount);
        const globalTotal = historyArr.reduce((acc, cur) => acc + cur.amount, 0);
        const myCont = historyArr.find(x => x.uid === userData.uid);
        const myTotal = myCont ? myCont.amount : 0;

        const isCompleted = proj.status === 'Completed';
        const statusClass = isCompleted ? 'completed' : 'ongoing';
        const statusLabel = isCompleted ? 'Completed' : 'Ongoing';

        let rowsHtml = "";
        historyArr.slice(0, 5).forEach((item, index) => {
            rowsHtml += `<tr class="${item.uid === userData.uid ? 'my-row' : ''}"><td>${item.smat_id}</td><td>${item.amount.toFixed(2)}</td><td>#${index+1}</td></tr>`;
        });

        htmlContent += `
            <div class="proj-card">
                <div class="status-badge ${statusClass}">${statusLabel}</div>
                <div class="proj-top">
                    <img src="${proj.logo}" class="proj-logo">
                    <h2 class="mon-900" style="color:var(--accent); font-size:16px;">${proj.title}</h2>
                </div>

                <div class="links-grid">
                    <a href="${proj.web_url}" target="_blank" class="link-item"><span>Website</span><i class="fas fa-globe"></i></a>
                    <a href="${proj.telegram_url}" target="_blank" class="link-item"><span>Telegram</span><i class="fab fa-telegram"></i></a>
                    <a href="${proj.twitter_url}" target="_blank" class="link-item"><span>Twitter</span><i class="fab fa-twitter"></i></a>
                    <a href="${proj.discord_url || '#'}" target="_blank" class="link-item"><span>Discord</span><i class="fab fa-discord"></i></a>
                </div>

                <div class="tokenomics-box">
                    <div class="mon-900" style="color:var(--primary); font-size:11px; margin-bottom:8px;">Tokenomics</div>
                    <div class="token-row"><span>Total Tokens:</span><b>${proj.total_tokens}</b></div>
                    <div class="token-row"><span>Vesting:</span><b>${proj.vesting_percent}%</b></div>
                </div>

                <div class="description-box">${proj.description || 'No description provided.'}</div>

                <button class="btn-participate mon-900" 
                    ${isCompleted ? 'disabled' : ''} 
                    onclick="openModal('${proj.id}')">
                    ${isCompleted ? 'SALE FINISHED' : 'PARTICIPATE NOW'}
                </button>

                <div class="stats-card">
                    <div class="stat-box"><span>MY FUNDING</span><b>${myTotal.toFixed(2)}</b></div>
                    <div class="stat-box"><b style="color:var(--accent); font-size:8px;">SMAT VENTURE</b></div>
                    <div class="stat-box"><span>GLOBAL FUNDING</span><b>${globalTotal.toFixed(2)}</b></div>
                </div>

                <div class="history-box">
                    <span class="mon-900" style="font-size:10px; color:var(--text-sec)">Funding History</span>
                    <table>
                        <thead><tr><th>SMAT ID</th><th>AMOUNT</th><th>RANK</th></tr></thead>
                        <tbody>${rowsHtml || '<tr><td colspan="3" style="text-align:center">No contributions</td></tr>'}</tbody>
                    </table>
                </div>
            </div>
        `;
    }
    container.innerHTML = htmlContent; // লুপ শেষে একবারে DOM আপডেট করা হলো
}

function openModal(id) {
    activeInvestProj = allProjects.find(p => p.id === id);
    if(activeInvestProj) {
        document.getElementById('userBalDisplay').innerText = "Balance: " + (userData.usdt_balance || 0).toFixed(2) + " USDT";
        document.getElementById('fundModal').style.display = 'flex';
    }
}

function closeModal() { document.getElementById('fundModal').style.display = 'none'; document.getElementById('investAmt').value = ""; }

async function confirmInvestment() {
    const amtInput = document.getElementById('investAmt');
    const amt = parseFloat(amtInput.value);
    
    if(!amt || amt <= 0) return showToast("Invalid Amount!", "#f6465d");
    if(amt > (userData.usdt_balance || 0)) return showToast("Insufficient USDT Balance!", "#f6465d");

    const confirmBtn = document.getElementById('confirmBtn');
    confirmBtn.disabled = true;
    confirmBtn.innerText = "Processing...";

    const pid = activeInvestProj.id;
    const projectTitle = activeInvestProj.title;

    db.ref('fundraising_contributions/' + pid + '/' + userData.uid).once('value', s => {
        const prev = s.val() ? s.val().amount : 0;
        const updates = {};
        const timestamp = Date.now();
        const historyID = "HIST_" + timestamp;

        updates['users/' + userData.uid + '/usdt_balance'] = parseFloat((userData.usdt_balance - amt).toFixed(8));
        updates['fundraising_contributions/' + pid + '/' + userData.uid] = {
            amount: prev + amt,
            smat_id: userData.smatID || "User",
            timestamp: timestamp
        };
        updates['users/' + userData.uid + '/history/' + historyID] = {
            method: 'Venture Out Fund',
            coin: 'USDT',
            amount: amt.toFixed(2),
            timestamp: timestamp,
            status: 'success',
            note: 'Participated in ' + projectTitle
        };

        db.ref().update(updates).then(() => {
            showToast("Contribution Successful!");
            confirmBtn.disabled = false;
            confirmBtn.innerText = "Confirm";
            closeModal();
        }).catch(err => {
            showToast("Transaction Failed!", "#f6465d");
            confirmBtn.disabled = false;
            confirmBtn.innerText = "Confirm";
        });
    });
}

function showToast(msg, color = "#00ffff") {
    const container = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'g-toast';
    t.style.borderLeftColor = color;
    t.innerHTML = `<span class="mon-900" style="font-size:9px; color:${color}; display:block; margin-bottom:5px;">SYSTEM</span>
                   <span style="font-size:12px; color:white;">${msg}</span>`;
    container.appendChild(t);
    setTimeout(() => {
        t.style.opacity = "0";
        t.style.transform = "translateY(-20px)";
        setTimeout(() => t.remove(), 500);
    }, 3000);
}
</script>
</body>
</html>
