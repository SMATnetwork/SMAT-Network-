<html lang="en">
<head>

    <style>
        :root {
            --bg: #0b0e11; --card: #1e2329; --primary: #ffff00;
            --accent: #00ffff; --up: #0ecb81; --text-sec: #848e9c;
            --border: rgba(255, 255, 255, 0.08);
            --font-mont: 'Montserrat', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; font-weight: 700; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; padding-bottom: 100px; display: none; overflow-x: hidden; }

        /* Empty State */
        #emptyState { display: none; text-align: center; padding: 100px 20px; }
        #emptyState i { font-size: 60px; color: var(--border); margin-bottom: 20px; }
        #emptyState p { color: var(--text-sec); font-size: 14px; font-weight: 400; }

        /* Main Content Wrapper */
        #mainContent { display: none; }

        .project-header { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, rgba(0, 255, 255, 0.05) 0%, var(--bg) 100%); }
        .project-logo { width: 85px; height: 85px; border-radius: 20px; border: 2px solid var(--accent); margin-bottom: 15px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); object-fit: cover; }
        .project-title { font-family: var(--font-mont); font-size: 24px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        
        .social-links { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .social-links a { color: var(--text-sec); font-size: 20px; transition: 0.3s; }
        .social-links a:hover { color: var(--accent); }

        .token-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 15px; margin-bottom: 25px; }
        .detail-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .detail-box span { color: var(--text-sec); display: block; font-size: 9px; text-transform: uppercase; margin-bottom: 5px; }
        .detail-box b { font-size: 12px; color: white; word-break: break-all; }

        .description { padding: 0 20px; font-size: 13px; color: var(--text-sec); line-height: 1.6; margin-bottom: 30px; font-weight: 400; text-align: justify; }

        /* Glowing Card */
        .funding-card { margin: 0 15px; background: #161a1e; border-radius: 24px; padding: 25px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: relative; }
        .fund-side { text-align: center; flex: 1; }
        .fund-side span { font-size: 10px; color: var(--text-sec); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .fund-side b { font-size: 15px; font-family: var(--font-mont); color: white; }

        .glowing-center { position: relative; width: 100px; text-align: center; }
        .venture-text { font-family: var(--font-mont); font-size: 10px; color: var(--accent); line-height: 1.2; animation: glow 1.5s infinite alternate; font-weight: 900; }
        @keyframes glow { from { text-shadow: 0 0 2px var(--accent); opacity: 0.5; } to { text-shadow: 0 0 15px var(--accent), 0 0 25px var(--accent); opacity: 1; } }

        /* Contribution Input */
        .input-area { padding: 25px 15px; }
        .input-group { background: var(--card); border-radius: 18px; padding: 18px; border: 1px solid var(--border); display: flex; align-items: center; margin-bottom: 15px; }
        .input-group input { background: transparent; border: none; color: white; flex: 1; font-size: 22px; outline: none; font-weight: 900; width: 100%; }
        .input-group span { color: var(--primary); font-weight: 900; font-size: 14px; }

        .btn-fund { width: 100%; background: var(--accent); color: #000; border: none; padding: 18px; border-radius: 18px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 255, 255, 0.15); text-transform: uppercase; }

        /* Leaderboard Table */
        .leaderboard { margin-top: 30px; padding: 0 15px; }
        .leaderboard h3 { font-family: var(--font-mont); font-size: 14px; margin-bottom: 15px; color: var(--text-sec); text-transform: uppercase; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 320px; }
        th { text-align: left; font-size: 10px; color: var(--text-sec); text-transform: uppercase; padding: 12px 10px; border-bottom: 1px solid var(--border); }
        td { padding: 15px 10px; font-size: 12px; border-bottom: 1px solid var(--border); }
        .my-row { background: rgba(0, 255, 255, 0.08) !important; color: var(--accent); }
        .my-row td { border-bottom: 1px solid var(--accent); }

        .show-more { text-align: center; padding: 25px; color: var(--accent); font-size: 13px; cursor: pointer; text-decoration: underline; }

        #toast-box { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10001; pointer-events: none; }
        .g-toast { background: var(--card); border-left: 4px solid var(--accent); padding: 15px 25px; border-radius: 12px; color: white; font-size: 13px; margin-bottom: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="toast-box"></div>

    <div id="emptyState">
        <i class="fas fa-rocket"></i>
        <p>No active fundraising projects at the moment.<br>Please check back later.</p>
    </div>

    <div id="mainContent">
        <div class="project-header">
            <img src="" class="project-logo" id="projLogo">
            <h1 class="project-title" id="projTitle"></h1>
            <div class="social-links" id="projSocials"></div>
        </div>

        <div class="token-details">
            <div class="detail-box"><span>Token Name</span><b id="tName"></b></div>
            <div class="detail-box"><span>Total Supply</span><b id="tSupply"></b></div>
            <div class="detail-box"><span>BlockScan</span><b id="tScan"></b></div>
            <div class="detail-box"><span>Vesting Rule</span><b id="tVesting"></b></div>
        </div>

        <div class="description" id="projDesc"></div>

        <div class="funding-card">
            <div class="fund-side"><span>My Funding</span><b id="myFund">0.00 USDT</b></div>
            <div class="glowing-center"><div class="venture-text">SMAT<br>VENTURE</div></div>
            <div class="fund-side"><span>Total Funding</span><b id="totalFund">0.00 USDT</b></div>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input type="number" id="fundAmount" placeholder="0.00">
                <span>USDT</span>
            </div>
            <button class="btn-fund" onclick="contribute()">SUBMIT FUNDING</button>
        </div>

        <div class="leaderboard">
            <h3>Leaderboard (Top Contributors)</h3>
            <div class="table-container">
                <table>
                    <thead><tr><th>SMAT ID</th><th>Method</th><th>Amount</th></tr></thead>
                    <tbody id="leaderTable"></tbody>
                </table>
            </div>
            <div class="show-more" onclick="loadMore()" id="moreBtn">Show More</div>
        </div>
    </div>

<script>
// --- FIREBASE CONFIG ---
const firebaseConfig = { 
    apiKey: "AIzaSyAMxtJedkehhxJRMPZLjhpKHqneHEWsGlE", 
    authDomain: "smat-exchange.firebaseapp.com", 
    projectId: "smat-exchange", 
    databaseURL: "https://smat-exchange-default-rtdb.firebaseio.com" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userData = {}, activeProject = null, allContributors = [];
let displayLimit = 50;

auth.onAuthStateChanged(user => {
    if (user) { document.body.style.display = "block"; loadProject(); loadUser(user.uid); }
    else { window.location.href = "logIn.html"; }
});

function loadUser(uid) {
    db.ref('users/' + uid).on('value', snap => {
        userData = snap.val() || {};
        userData.uid = uid;
        if(activeProject) renderLeaderboard();
    });
}

function loadProject() {
    // এডমিন প্যানেল থেকে 'active_fundraising' নোডে ডেটা সেট করলেই পেজ দেখাবে
    db.ref('active_fundraising').on('value', snap => {
        activeProject = snap.val();
        
        if (!activeProject || !activeProject.id) {
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
            return;
        }

        // ডেটা থাকলে পেজ প্রদর্শন হবে
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        document.getElementById('projTitle').innerText = activeProject.title;
        document.getElementById('projLogo').src = activeProject.logo;
        document.getElementById('tName').innerText = activeProject.tokenName;
        document.getElementById('tSupply').innerText = activeProject.supply;
        document.getElementById('tScan').innerText = activeProject.scan;
        document.getElementById('tVesting').innerText = activeProject.vesting;
        document.getElementById('projDesc').innerText = activeProject.description;
        
        document.getElementById('projSocials').innerHTML = `
            <a href="${activeProject.web}"><i class="fas fa-globe"></i></a>
            <a href="${activeProject.tg}"><i class="fab fa-telegram"></i></a>
            <a href="${activeProject.tw}"><i class="fab fa-twitter"></i></a>
            <a href="${activeProject.ds}"><i class="fab fa-discord"></i></a>
        `;

        loadContributors();
    });
}

function loadContributors() {
    db.ref('fundraising_contributions/' + activeProject.id).on('value', snap => {
        const val = snap.val() || {};
        allContributors = Object.keys(val).map(k => ({uid: k, ...val[k]}))
            .sort((a,b) => b.amount - a.amount);
        
        let total = allContributors.reduce((sum, item) => sum + item.amount, 0);
        document.getElementById('totalFund').innerText = total.toFixed(2) + " USDT";
        
        const myData = allContributors.find(x => x.uid === userData.uid);
        document.getElementById('myFund').innerText = (myData ? myData.amount : 0).toFixed(2) + " USDT";

        renderLeaderboard();
    });
}

function renderLeaderboard() {
    const table = document.getElementById('leaderTable');
    table.innerHTML = "";
    
    // নিজের ডাটা (আলাদা কালার)
    const myData = allContributors.find(x => x.uid === userData.uid);
    if(myData) {
        table.innerHTML += `<tr class="my-row"><td>${userData.smat_id || 'Me'}</td><td>USDT</td><td>${myData.amount.toFixed(2)}</td></tr>`;
    }

    // বাকিদের ডাটা
    allContributors.slice(0, displayLimit).forEach(item => {
        if(item.uid === userData.uid) return;
        table.innerHTML += `<tr><td>${item.smat_id}</td><td>USDT</td><td>${item.amount.toFixed(2)}</td></tr>`;
    });

    document.getElementById('moreBtn').style.display = allContributors.length > displayLimit ? 'block' : 'none';
}

async function contribute() {
    const amt = parseFloat(document.getElementById('fundAmount').value);
    const balance = parseFloat(userData.usdt_balance || 0);

    if(!amt || amt <= 0 || amt > balance) return showToast("Invalid amount or balance!");

    const up = {};
    const projId = activeProject.id;
    
    // ব্যালেন্স কমানো (usdt_balance)
    up[`users/${userData.uid}/usdt_balance`] = parseFloat((balance - amt).toFixed(8));
    
    // কন্ট্রিবিউশন আপডেট
    let current = 0;
    const existing = allContributors.find(x => x.uid === userData.uid);
    if(existing) current = existing.amount;

    up[`fundraising_contributions/${projId}/${userData.uid}`] = {
        amount: current + amt,
        smat_id: userData.smat_id || "User",
        timestamp: Date.now()
    };

    // হিস্টোরি (Funding Out)
    const tid = "FUND_OUT_" + Date.now();
    up[`users/${userData.uid}/history/${tid}`] = {
        method: 'Funding Out', coin: 'USDT', amount: amt.toFixed(2), timestamp: Date.now(), status: 'success'
    };

    await db.ref().update(up);
    document.getElementById('fundAmount').value = "";
    showToast("Contribution Successful!", "success");
}

function loadMore() { displayLimit += 50; renderLeaderboard(); }

function showToast(msg) {
    const box = document.getElementById('toast-box');
    const t = document.createElement('div');
    t.className = 'g-toast';
    t.innerHTML = `<i class="fas fa-check-circle"></i><span>${msg}</span>`;
    box.appendChild(t);
    setTimeout(() => { t.remove(); }, 3000);
}
</script>
</body>
